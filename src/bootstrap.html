<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<!--
  THE UNAUTHENTICATED SHELL, AND IT CARRIES NO CONTENT.
  Telegram puts the launch parameters in the URL FRAGMENT (#tgWebAppData=...), and a fragment is
  never sent to a server -- so no server on earth can validate a Mini App launch on the first GET.
  This is the smallest thing that closes that gap: it reads the fragment, hands it to the Worker,
  and is replaced wholesale by whatever comes back. It holds no plan, no design system, and no
  clue about who is allowed in. A stranger who finds this URL gets this file, a 401, and one line.
-->
<style nonce="__NONCE__">
  :root{color-scheme:light dark; --bg:#fafafa; --fg:#0b0b0b}
  @media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#111111; --fg:#fafafa}}
  :root[data-theme=dark]{--bg:#111111; --fg:#fafafa}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
  p{margin:0;padding:2rem 1.25rem;font:0.875rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  [hidden]{display:none !important}
</style>
</head>
<body>
<p id="m" hidden>Open this from the chat.</p>
<script nonce="__NONCE__">
(function () {
  "use strict";
  function launchParams() {
    // The fragment is where Telegram puts it. The query string is checked too because a direct
    // link (t.me/<bot>/<app>) can deliver it there on some clients.
    var sources = [location.hash.replace(/^#/, ""), location.search.replace(/^\?/, "")];
    for (var i = 0; i < sources.length; i++) {
      try {
        var v = new URLSearchParams(sources[i]).get("tgWebAppData");
        if (v) return v;
      } catch (e) { /* fall through */ }
    }
    return "";
  }
  function fail() { document.getElementById("m").hidden = false; }

  // Always POST, even with nothing to send. The failure path is then IDENTICAL whether the
  // launch parameters were absent, forged or expired -- one request, one 401, one line of text.
  // Branching here would tell a stranger which of those they are.
  fetch("/s", {
    method: "POST",
    headers: { "X-Telegram-Init-Data": launchParams() },
    cache: "no-store",
    credentials: "omit",
  }).then(function (r) {
    if (!r.ok) { fail(); return null; }
    return r.text();
  }).then(function (html) {
    if (html === null) return;
    // document.write after an explicit open() is the one route that both replaces the document
    // and executes the inline scripts in what replaces it. innerHTML does not run scripts.
    document.open();
    document.write(html);
    document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
