      // TWO FACTS, TWO COLUMNS. This used to read "Sun 7 Sep <middot> 05:30-08:00", which joins a
      // date to a span with a punctuation glyph doing the work of layout. The day and the window
      // are different kinds of thing and are set apart with space instead.
      var window_ = el("span", "window");
      add(window_, el("span", "day", dayLabel(s)));
      var from = hhmm(s.at), to = hhmm(s.until);
      if (from) add(window_, el("span", "span", from + (to ? "–" + to : "")));
      add(clock, window_);
      add(c, clock);
    }

    var dl = el("dl");
    var any = false;
    if (s.place)  { add(dl, el("dt", null, "Where")); add(dl, el("dd", null, s.place));  any = true; }
    if (s.travel) { add(dl, el("dt", null, "Travel")); add(dl, el("dd", null, s.travel)); any = true; }
    if (any) add(c, dl);

    // THE SESSION'S OWN FIGURES, which this card went without for its whole life while the week
    // screen two taps away printed them. They are the PRESCRIPTION -- "24.0-25.5 kg, military
    // press, 80-85% of 5RM", "6:06/km, aim at this" -- so the one screen he reads at 06:15 was the
    // one screen that did not carry the numbers he is about to lift or run to. Same markup and same
    // class as the week's rows: a figure is a figure on both screens.
    add(c, figures(s.numbers));

    if (s.oneRule) {
      add(c, el("hr", "rule"));
      add(c, el("p", "onerule", s.oneRule));
    }
    if (Array.isArray(s.bring) && s.bring.length) {
      var ul = el("ul", "bring");
      ul.setAttribute("aria-label", "Bring");
      for (var i = 0; i < s.bring.length; i++) add(ul, el("li", null, s.bring[i]));
      add(c, ul);
    }
    return c;
  }

  // WHAT COMES AFTER TODAY, and deliberately not "the next session". Today is drawn IN FULL below
  // the hero, so the second thing in the window is almost always a row that list already
  // carries -- and repeating it under the list is the one duplication a screen this short cannot
  // afford. What the list genuinely cannot show is tomorrow and the day after, so that is what this
  // card is: one line of it, plus the count of the rest.
  //
  // IT IS THE ONE BOXED THING ON A HEALTHY SCREEN, and the box is the rule rather than a leftover:
  // a border here marks an aside, and this is a different day.
  function renderAfterToday(a) {
    var s = a.next;
    var c = el("div", "card");
    add(c, el("span", "kind", "After today"));
    var row = el("p", "next");
    var when = dayLabel(s);
    var t = hhmm(s.at);
    // A date and a time are the same KIND of fact -- one stamp, read as one thing -- so the dot
    // stays here where it was removed from the clock's window line.
    if (t) when += " · " + t;
    add(row, el("span", "when", when));
    var what = el("span", "what");
    if (s.sport === "run" || s.sport === "ride") what.appendChild(sportMark(s.sport));
    what.appendChild(document.createTextNode(s.title));
    add(row, what);
    add(c, row);
    // The window is today and the next two days, so what is left beyond this row is two days wide.
    if (a.more > 0) {
      add(c, el("p", "later", a.more === 1
        ? "1 more after that in the next two days."
        : a.more + " more after that in the next two days."));
    }
    return c;
  }

  function renderToday() {
    add(root, renderHeader());

    // Two different kinds of out-of-date, reported separately. A plan pushed an hour ago for last
    // week is fresh and useless; a plan for this week pushed four days ago is old and correct.
    if (!view.coversToday) {
      add(root, banner("Not this week", "The published plan runs " + view.weekStart + " to " + view.weekEnd +
        ", so it says nothing about today (" + view.today + "). There is nothing here for today, and " +
        "anything shown would be a guess."));
    } else if (view.stale) {
      var age = view.ageHours === null ? null : Math.round(view.ageHours);
      add(root, banner("Possibly out of date", age === null
        ? "This plan does not say when it was published, so how current it is cannot be established."
        : "This plan was last published about " + age + " hours ago. It may not reflect a change made since."));
    }

    if (view.now) {
      add(root, renderSession(view.now));
      if (view.now.intention) {
        var why = el("p", "why");
        add(why, el("b", null, "Why this session"));
        why.appendChild(document.createTextNode(view.now.intention));
        add(root, why);
      }
    } else if (view.coversToday) {
      add(root, banner(
        view.emptyReason === "empty" ? "Nothing published" : "Nothing left",
        view.emptyReason === "empty"
          ? "The published plan contains no days at all."
          : "Nothing is still to come in the next three days. Everything in that window is done, missed, or a rest by design."));
    }

    // TODAY, IN FULL. The hero answers the 6am question and is what this screen is FOR, but it
    // is one session, and everything the reader could not see without opening the week -- the day's
    // character, the sessions that are done or declined, the figures, tonight's bedtime -- was one
    // tap away on a screen he does not open at 06:15.
    var d = todayDay();
    if (d) {
      var full = renderTodayInFull(d, view.now && view.now.date === view.today ? view.now.key : null);
      if (full) add(root, full);
    }

    if (view.afterToday.next) add(root, renderAfterToday(view.afterToday));

    var f = el("footer", "credit", view.plannedKm
      ? view.weekLabel + " · " + view.plannedKm + " km planned" + (view.ceilingKm ? " of a " + view.ceilingKm + " km ceiling" : "")
      : view.weekLabel);
    add(root, f);
  }

  // ── the week screen ───────────────────────────────────────────────────────────────────────

  function hasWeek() {
    return Boolean(view && view.ok && view.week && view.week.days && view.week.days.length);
  }

  // THE TWO TAB MARKS, drawn here rather than fetched, and the only marks on this page that are
  // not from the calvin.sg set. That set is closed and ships nothing meaning "today" or "the
  // week", and Apple's guidance for a tab bar is explicit that a tab carries a symbol above its
  // label -- so the bar borrows its marks from the platform's vocabulary the same way it borrows
  // its material. A clock for the session in front of you, a calendar for the seven days.
  // They reach nothing outside `.navbar`.
  var TAB_PATHS = {
    today: "M12 3a9 9 0 100 18 9 9 0 000-18zM12 7.75V12.25l3 1.75",
    week: "M6.5 4h11A2.5 2.5 0 0120 6.5v11a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5v-11A2.5 2.5 0 016.5 4zM4 9.5h16M8 2.75v2.5M16 2.75v2.5",
  };

  function tabMark(name) {
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "tabmark");
    svg.setAttribute("viewBox", "0 0 24 24");
    // The label beneath it is the accessible name, so the mark is decoration to the tree -- the
    // same idiom the sport marks and the theme control's sun and moon already use.
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("d", TAB_PATHS[name]);
    svg.appendChild(path);
    return svg;
  }

  /**
   * @param label     the destination's own name, and the same string its heading uses
   * @param onClick   what it does
   * @param isCurrent whether this is the screen already showing. Optional, and only the
   *                  navigation passes it -- `aria-current` is what tells a screen reader which
   *                  of the two you are on, and the tint is what tells everyone else.
   * @param mark      which tab mark sits above the label. Optional for the same reason: the
   *                  argument list grows rightward so `navChip("Today", fn)` still reads and
   *                  still works for any caller that only wants a labelled control.
   */
  function navChip(label, onClick, isCurrent, mark) {
    var b = el("button", "chip");
    b.type = "button";
    if (mark) b.appendChild(tabMark(mark));
    add(b, el("span", "lbl", label));
    if (isCurrent) b.setAttribute("aria-current", "page");
    b.addEventListener("click", onClick);
    return b;
  }

  // THE BAR ITSELF. Refilled rather than rebuilt, and hidden outright until there is a week --
  // an error screen has one screen, and offering a tab to a second one that does not exist is a
  // control that lies. That is the same condition the old in-page chip carried.
  function renderNav() {
    // WHAT DECIDES THIS IS `ok`, NOT WHETHER THE WEEK HAS ANY DAYS IN IT, and the distinction is
    // the whole of Apple's rule here: "Don't disable or hide tab bar buttons, even when their
    // content is unavailable... If a section is empty, explain why its content is unavailable."
    //
    // A PUBLISHED PLAN WITH NO DAYS IS AN EMPTY SECTION, not an absent one. The Week screen exists,
    // it has something true to say -- nothing has been published -- and hiding the way to it means
    // the reader cannot go and read that for themselves. `renderWeek` prints the explanation the
    // guidance asks for.
    //
    // A REFUSAL IS NOT AN EMPTY SECTION. On the error path there is no plan, no week and no
    // account: there are no sections at all, so a tab leading to one would be a control that lies
    // about having something behind it -- which is this page's own rule, written on the past-day
    // disclosure. The two look like one case and are not, and this is the line between them.
    if (!view || !view.ok) { navEl.hidden = true; pillEl.textContent = ""; return; }
    pillEl.textContent = "";
    add(pillEl, navChip("Today", function () { show("today"); }, screen === "today", "today"));
    add(pillEl, navChip("Week", function () { show("week"); }, screen === "week", "week"));
    navEl.hidden = false;
  }

  // MINIMISE ON A SCROLL DOWN, EXPAND ON A SCROLL UP, the way the platform's own bar behaves.
  // The threshold is what stops it flickering on the small deltas a finger produces at rest, and
  // the rAF gate is what keeps a scroll handler off the critical path.
  //
  // Under a reduced-motion preference it never minimises at all. The state is carried by padding
  // and type size rather than by the hit target, so a still frame at either size says the same
  // thing -- but a reader who asked for less movement is asking for the bar to hold still.
  var lastY = 0, ticking = false;
  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) { /* a client with no matchMedia gets the movement, which is the old behaviour */ }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      ticking = false;
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (Math.abs(y - lastY) < 8) return;
      // Never minimised at the very top: the bar's resting state is its full one.
      if (y > lastY && y > 24) navEl.setAttribute("data-min", "");
      else navEl.removeAttribute("data-min");
      lastY = y;
    });
  }
  if (!reduceMotion) window.addEventListener("scroll", onScroll, { passive: true });

  /** One decimal, and no trailing ".0" -- 44.23 is 44.2 km and 18 is 18 km, never 18.0. */
  function fmtKm(n) {
    return String(Math.round(n * 10) / 10);
  }

  // Two of the twenty marks calvin.sg ships, copied from the same Remix Icon set at the same
  // 24x24 grid as the sun and moon above. The set is CLOSED: anything not in it is drawn as a
  // word, never as an emoji and never from a second icon family.
  var SPORT_PATHS = {
    run: "M9.83 8.79L8 9.456V13H6V8.05h.015l5.268-1.918c.244-.093.51-.14.782-.131a2.62 2.62 0 0 1 2.427 1.82q.279.875.51 1.181A5 5 0 0 0 19 11v2a6.99 6.99 0 0 1-5.402-2.547l-.697 3.956L15 16.17V23h-2v-5.898l-2.27-1.904l-.727 4.127l-6.894-1.215l.348-1.97l4.924.868zM13.5 5.5a2 2 0 1 1 0-4a2 2 0 0 1 0 4",
    ride: "M5.5 21a4.5 4.5 0 1 1 0-9a4.5 4.5 0 0 1 0 9m0-2a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m13 2a4.5 4.5 0 1 1 0-9a4.5 4.5 0 0 1 0 9m0-2a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m-7.477-8.695L13 12v6h-2v-5l-2.719-2.266A2 2 0 0 1 8 7.671l2.828-2.828a2 2 0 0 1 2.829 0l1.414 1.414a6.97 6.97 0 0 0 3.917 1.975l-.01 2.015a8.96 8.96 0 0 1-5.321-2.575zM16 5a2 2 0 1 1 0-4a2 2 0 0 1 0 4",
  };

  function sportMark(sport) {
    var NS = "http://www.w3.org/2000/svg";
    var frag = document.createDocumentFragment();
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "sport sport--" + sport);
    svg.setAttribute("viewBox", "0 0 24 24");
    // Hidden from the tree with the word beside it, which is this page's existing idiom for a
    // mark -- the same shape the theme control's sun and moon already use.
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "currentColor");
    path.setAttribute("d", SPORT_PATHS[sport]);
    svg.appendChild(path);
    frag.appendChild(svg);
    frag.appendChild(el("span", "sr-only", sport === "run" ? "Run" : "Ride"));
    return frag;
  }

  // THE DISCLOSURE MARK, and it is not a new icon. The calvin.sg mark set is closed and ships no
  // chevron, so a spent day opens on the set's OWN right arrow, turned 90 degrees by CSS when the
  // day is open. Same mark, oriented -- rather than an emoji or a second icon family, both of which
  // the design system refuses outright.
  var ARROW_RIGHT = "m16.172 11l-5.364-5.364l1.414-1.414L20 12l-7.778 7.778l-1.414-1.414L16.172 13H4v-2z";

  function discMark() {
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "disc");
    svg.setAttribute("viewBox", "0 0 24 24");
    // The summary's own text says which day it is; the arrow only says "this opens", which the
    // element already tells the accessibility tree.
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "currentColor");
    path.setAttribute("d", ARROW_RIGHT);
    svg.appendChild(path);
    return svg;
  }

  function renderGauge(v) {
    var g = el("div", "gauge");
    var scale = el("p", "scale");

    if (typeof v.plannedKm !== "number") {
      add(scale, document.createTextNode("This plan does not state a distance for the week."));
      add(g, scale);
      return g;
    }

    // THE SCALE IS NAMED IN WORDS BEFORE THE BAR. A length means nothing until the reader knows
    // what it is measured against, and a target and a set's largest member are two different
    // pictures drawn identically.
    add(scale, el("b", null, fmtKm(v.plannedKm) + " km"));
    if (typeof v.fraction !== "number") {
      // Drawn as an ABSENCE and named. A ceiling nobody published and a week at 0% of its ceiling
      // are different facts, and only the undrawn bar can tell them apart.
      scale.appendChild(document.createTextNode(" planned."));
      add(g, scale);
      add(g, el("p", "absent", "No ceiling is published for this week, so there is nothing to measure it against."));
      return g;
    }
    scale.appendChild(document.createTextNode(" planned, of a "));
    add(scale, el("b", null, fmtKm(v.ceilingKm) + " km"));
    scale.appendChild(document.createTextNode(" ceiling."));
    add(g, scale);

    var bar = el("span", "bar");
    var fill = el("i");
    // CSSOM, not a style attribute: the CSP carries a nonce and no 'unsafe-inline', which forbids
    // a parsed style="" but does not reach a property set through the object model.
    fill.style.width = Math.max(0, Math.min(1, v.fraction)) * 100 + "%";
    add(bar, fill);
    add(g, bar);

    // The number is printed as well as drawn. A bar is a shape, and the reader who cannot resolve
    // the shape is the reader who most needs the value.
    var pct = Math.round(v.fraction * 1000) / 10;
    var step = el("p", "step");
    step.appendChild(document.createTextNode(
      pct + "% of the ceiling" + (v.fraction > 1 ? " — over it." : ".")));
    if (typeof v.stepPct === "number") {
      var d = Math.round(v.stepPct * 10) / 10;
      step.appendChild(document.createTextNode(
        " " + (d >= 0 ? "Up " : "Down ") + Math.abs(d) + "% on last week's " + fmtKm(v.priorWeekKm) + " km."));
    }
    add(g, step);
    return g;
  }

  /**
   * @param s        a session from the week
   * @param reveal   show a CLOSED session's detail too. False on the days ahead, where a skipped
   *                 session's rule and figures are noise; true inside an opened past day, where
   *                 the reader has explicitly asked what happened.
   */
  function renderSlot(s, reveal) {
    // `statusWord` is null for a planned session and a word for every other state. It decides both
    // the dim treatment and what is printed, so the two can never disagree.
    var closed = Boolean(s.statusWord);
    var li = el("li", "slot" + (closed ? " slot--closed" : ""));

    var t = hhmm(s.at);
    var col = el("span", t ? "t" : "t t--none", t || "—");
    var to = hhmm(s.until);
    if (t && to) add(col, el("span", "to", "–" + to));
    add(li, col);

    var body = el("div", "sbody");

    // `kind` IS SHOWN ONLY WHERE THERE IS NO CLOCK, and that is a deliberate exception to carrying
    // everything. It reads "Run <middot> 19:00" on a session whose `at` is 19:24 -- the artifact's
    // label quotes the CALL time and the payload states the gun -- so printing both puts two
    // disagreeing clocks on one row. CONTRACT.md says outright that `kind` is not a time and must
    // not be parsed for one, so stripping the clock out of it is not available either. Where the
    // session has no `at` at all, `kind` is the only thing describing it ("Ride <middot> evening",
    // "Rest <middot> by design") and it is shown in full.
    if (!t && s.kind) add(body, el("span", "kind", s.kind));

    var what = el("p", "what");
    if (s.sport === "run" || s.sport === "ride") what.appendChild(sportMark(s.sport));
    add(what, el("span", null, s.title));
    if (s.statusWord) add(what, el("span", "status", s.statusWord));
    add(body, what);

    // A CLOSED SESSION STOPS HERE ON THE DAYS AHEAD. Everything below is what to DO about a
    // session, and one already done or deliberately skipped is not one there is anything to do
    // about. Inside an opened past day it is shown anyway: there the question is not "what do I do"
    // but "what was this", and that is the question the reader just tapped to ask.
    if (!closed || reveal) {
      // `leaveBy` is the exception and stays hidden on a closed session even when revealed --
      // "leave by 04:55" under something that already happened is a number that has passed, which
      // is the one thing this app's largest element exists never to be.
      if (!closed) {
        var leave = hhmm(s.leaveBy);
        if (leave) add(body, el("p", "leave", "Leave by " + leave));
      }
      if (s.place) add(body, el("p", "where", s.place));
      if (s.travel) add(body, el("p", "where", s.travel));

      body.appendChild(figures(s.numbers));

      if (s.oneRule) add(body, el("p", "srule", s.oneRule));
      if (s.intention) add(body, el("p", "swhy", s.intention));

      if (Array.isArray(s.bring) && s.bring.length) {
        var ul = el("ul", "bring");
        ul.setAttribute("aria-label", "Bring");
        for (var j = 0; j < s.bring.length; j++) add(ul, el("li", null, s.bring[j]));
        add(body, ul);
      }
    }

    add(li, body);
    return li;
  }

  function renderBed(bed) {
    var p = el("p", "bed");
    add(p, el("span", "mc", "Bed"));
    if (bed.plan) add(p, el("span", "plan", bed.plan));
    if (bed.kind) p.appendChild(document.createTextNode(" · " + bed.kind));
    if (bed.text) p.appendChild(document.createTextNode(" " + bed.text));
    return p;
  }

  function renderDay(d) {
    var cls = "day";
    if (d.phase === "past") cls += " day--past";
    if (d.phase === "today") cls += " day--today";
    var sec = el("section", cls);
    if (d.phase === "today") sec.setAttribute("aria-current", "date");

    // A day already spent, collapsed to one line THAT OPENS. The summary is what a spent day
    // usually needs; the detail is there for the day you want to check. `<details>` rather than a
    // scripted toggle, so the disclosure, the keyboard handling and the semantics are the
    // platform's -- which is also what makes it work with no JS state to keep in step.
    if (d.phase === "past") {
      var bits = [];
      if (d.tag) bits.push(d.tag);
      var c = d.counts || { total: 0 };
      if (c.total === 0) {
        bits.push("nothing planned");
      } else {
        // EVERY OUTCOME, or the line lies by omission. Reporting only what was done makes a day of
        // one done and two missed read as a light day rather than a bad one.
        if (c.done) bits.push(c.done + " done");
        if (c.missed) bits.push(c.missed + " missed");
        if (c.skipped) bits.push(c.skipped + " skipped");
        if (c.other) bits.push(c.other + " unrecorded");
      }
      var line = " · " + bits.join(" · ");

      // A day with nothing under it is NOT a disclosure. A control that opens onto emptiness lies
      // about having something behind it, and a rest day is the commonest day of the week.
      if (d.sessions.length === 0 && !d.bed) {
        var p = el("p", "pastline");
        add(p, el("span", "d", dayLabel(d)));
        p.appendChild(document.createTextNode(line));
        add(sec, p);
        return sec;
      }

      var det = el("details");
      var sum = el("summary");
      sum.appendChild(discMark());
      add(sum, el("span", "d", dayLabel(d)));
      sum.appendChild(document.createTextNode(line));
      // One light knock when a spent day opens, and none when it closes: the answer belongs to
      // the thing arriving, not to it going away.
      det.addEventListener("toggle", function () { if (det.open) haptic("open"); });
      add(det, sum);

      if (d.sessions.length) {
        var pul = el("ul", "slots");
        // `true` -- inside an opened past day a closed session shows what it WAS, because that is
        // the question the reader just tapped to ask.
        for (var k = 0; k < d.sessions.length; k++) add(pul, renderSlot(d.sessions[k], true));
        add(det, pul);
      }
      if (d.bed) add(det, renderBed(d.bed));
      add(sec, det);
      return sec;
    }

    var h = el("h2", "dhead");
    add(h, el("span", "d", dayLabel(d)));
    if (d.tag) add(h, el("span", "tag", d.tag));
    if (d.phase === "today") add(h, el("span", "today", "Today"));
    add(sec, h);

    if (d.sessions.length) {
      var ul = el("ul", "slots");
      for (var i = 0; i < d.sessions.length; i++) add(ul, renderSlot(d.sessions[i]));
      add(sec, ul);
    } else {
      add(sec, el("p", "pastline", "Nothing planned."));
    }
    if (d.bed) add(sec, renderBed(d.bed));
    return sec;
  }

  // ── today, in full, on the FIRST screen ───────────────────────────────────────────────────
  //
  // These two belong to the Today screen and live here anyway, next to `renderDay`, because the
  // thing they have to keep is a likeness to it. The Today screen used to carry one session in
  // detail and a one-line preview of the next; the same day drawn on the week screen carried the
  // day's tag, EVERY session with its status, its figures and its rule, and the bedtime that closes
  // the day. Two screens disagreeing about the same day is a defect, and the reader met the poorer
  // one first.
  //
  // THE PARITY IS STRUCTURAL, NOT A PROMISE. This calls `renderSlot` and `renderBed` -- the same
  // functions, with the same `reveal` argument `renderDay` passes for a day that is not past -- so
  // a field added to a week row appears here with no second edit. Nothing in the suite renders the
  // DOM, so a copy of that markup could drift with every test still green; sharing the function is
  // what makes drift impossible rather than merely unlikely.
  //
  // ONE FIELD IS MISSING FROM BOTH AND MUST STAY MISSING: `note`. The artifact prints it inside
  // its own day card, and it is where the corrections live and where two of the live week's six
  // notes carry literal <b> tags. `reduce.js` refuses it and `publish.mjs` enforces the refusal.
  function todayDay() {
    if (!view.week || !view.week.days) return null;
    for (var i = 0; i < view.week.days.length; i++) {
      if (view.week.days[i].phase === "today") return view.week.days[i];
    }
    return null;
  }

  /**
   * @param d        today, out of the week
   * @param heroKey  the key of the session already drawn as the hero, or null when the hero
   *                 is showing a LATER day -- which is the case on a day whose plan is spent, and
   *                 there this block is the only account of what happened.
   */
  function renderTodayInFull(d, heroKey) {
    var others = [];
    for (var i = 0; i < d.sessions.length; i++) {
      if (d.sessions[i].key !== heroKey) others.push(d.sessions[i]);
    }
    // Nothing to say, and no head to say it under. A day with a tag or a bedtime still has
    // something the hero cannot carry, so those alone are enough to draw the block.
    if (!others.length && !d.bed && !d.tag) return null;

    var sec = el("section", "dayfull");
    sec.setAttribute("aria-current", "date");
    // The day's own head, exactly as the week draws it -- MINUS the "Today" dot and word, which is
    // the one thing that would be furniture here: this whole screen is today.
    var h = el("h2", "dhead");
    add(h, el("span", "d", dayLabel(d)));
    if (d.tag) add(h, el("span", "tag", d.tag));
    add(sec, h);

    if (others.length) {
      var ul = el("ul", "slots");
      // No `reveal`, which is what `renderDay` passes for a day that is not behind him: a closed
      // session's rule and figures are what to DO about it, and there is nothing to do about one
      // already done or declined. The status word still prints, so the row says what it was.
      for (var j = 0; j < others.length; j++) add(ul, renderSlot(others[j]));
      add(sec, ul);
    } else {
      add(sec, el("p", "pastline", heroKey ? "Nothing else today." : "Nothing planned today."));
    }
    if (d.bed) add(sec, renderBed(d.bed));
    return sec;
  }

  function renderWeek() {
    var w = view.week;
    var h = el("header");
    if (view.weekLabel) add(h, el("span", "week", view.weekLabel));
    add(root, h);

    // The control that opened this screen says "Week" and so does its heading. Two strings
    // that have to agree are one string.
    add(root, el("h1", "weekhead", "Week"));
    if (typeof w.daysToKiprun === "number" && w.daysToKiprun >= 0) {
      add(root, el("p", "race", w.daysToKiprun === 0
        ? "Kiprun is today."
        : w.daysToKiprun === 1 ? "Kiprun is tomorrow." : "Kiprun in " + w.daysToKiprun + " days."));
    }

    add(root, renderGauge(w.volume || {}));
    // THE EXPLANATION THE TAB NOW OWES THE READER. The navigation stays drawn when a published
    // plan has no days in it, so this screen has to say why it is empty rather than simply being
    // empty -- an unexplained blank is indistinguishable from a page that failed to load, which is
    // the same reason the skeleton exists.
    if (!hasWeek()) {
      add(root, el("p", "race", "This plan contains no days, so there is nothing to show for any day of the week."));
      return;
    }
    for (var i = 0; i < w.days.length; i++) add(root, renderDay(w.days[i]));
  }

  // ── the two screens ───────────────────────────────────────────────────────────────────────

  var screen = "today";

  // WHAT STANDS IN THE HERO'S PLACE WHILE THE NETWORK ANSWERS. Not a spinner and not a blank
  // page: a blank page is indistinguishable from one that failed to load, and this one used to
  // show exactly that for the whole duration of the fetch.
  function renderSkeleton() {
    var s = el("div", "skel");
    s.setAttribute("aria-hidden", "true");
    add(s, el("span", "s-kind"));
    add(s, el("span", "s-title"));
    add(s, el("span", "s-label"));
    add(s, el("span", "s-clock"));
    add(s, el("span", "s-win"));
    root.textContent = "";
    // The word, for a reader who gets no shapes at all. `role="status"` so it is announced
    // rather than found.
    var live = el("p", "sr-only", "Loading the plan.");
    live.setAttribute("role", "status");
    add(root, live);
    add(root, s);
  }

  function paint() {
    root.textContent = "";
    if (!view.ok) {
      var b = add(root, banner("Cannot show the plan", view.error || "Something is wrong with the published plan."));
      // Only the web route can offer a way out of a refusal. In Telegram a 401 means this is not
      // the allowed account, and there is nothing the reader can do about it.
      if (view.signin) {
        var a = add(b, el("a", "signin", "Sign in"));
        a.setAttribute("href", "/web/signin");
      }
      renderNav();
      return;
    }
    if (screen === "week") renderWeek(); else renderToday();
    renderNav();
  }

  function show(next) {
    haptic("select");
    screen = next;
    // The screen's name goes on the LANDMARK rather than into a visible eyebrow. It gives the
    // region the name the accessibility guidance asks for, at both ends of the navigation, without
    // adding a word above the one number this design exists to keep loudest.
    root.setAttribute("aria-label", next === "week" ? "Week" : "Today");
    setBackButton(next === "week");
    paint();
    // A swapped screen starts at its own top. Without this, returning from the foot of a scrolled
    // week lands the reader partway down a layout that is no longer there.
    window.scrollTo(0, 0);
    lastY = 0;
    navEl.removeAttribute("data-min");
    root.focus();
  }

  // THE GEAR IS A SHORTCUT TO THE CONTROL, NEVER ITS ONLY HOME -- and that distinction is the
  // whole lesson of the dead back arrow. `web_app_setup_settings_button` needs Bot API 6.10 and a
  // bridge, and on a home-screen web app there is no bridge at all, so a theme control that lived
  // only behind the gear would be unreachable there and on any client where the event is accepted
  // and never delivered. The fieldset at the foot is always rendered and always wired; this puts a
  // second, faster way to reach it in Telegram's own chrome for the clients that have one.
  function revealThemeControl() {
    var first = document.getElementById("theme-system");
    if (!first) return;
    var label = document.querySelector("label[for=theme-system]");
    if (label && label.scrollIntoView) label.scrollIntoView({ block: "center" });
    first.focus();
  }

  // The screen a launch opens on, which is `today` unless a deep link said otherwise.
  //
  // !! THE DEEP LINK IS HONOURED ONLY WHEN THERE IS A WEEK TO SHOW. This is also the error path,
  // and an error state has exactly one screen -- opening a refusal with the back arrow lit and an
  // aria-label reading "Week" would describe a screen that is not on the page.
  // Which screen a deep link asked for. TWO SOURCES, and the SIGNED one wins.
  //
  // !! The URL copy was the only source until a real launch opened on `today` with `?startapp=week`
  // tapped. `start_param` inside the verified initData carries the same value and is the copy the
  // bot token vouches for; the page reads it here rather than pre-paint because `screen` was never
  // decided before the server answered anyway -- the old comment claiming a pre-paint advantage
  // described a benefit the code did not take.
  function startParamOf(v) {
    if (v && v.ok && v.startParam) return v.startParam;
    return (launch && launch.startParam) || "";
  }

  function render(v) {
    view = v;
    screen = v && v.ok ? screenFor(startParamOf(v)) : "today";
    root.setAttribute("aria-label", screen === "week" ? "Week" : "Today");
    setBackButton(screen === "week");
    paint();
  }

  // Tell Telegram we are up before the network call, so the client stops showing its own
  // placeholder while we wait.
  postEvent("web_app_ready");
  postEvent("web_app_expand");
  // After ready, deliberately: the client sets up its own chrome on that event, so colours sent
  // before it are the ones it overwrites.
  syncChrome();

  // The three messages below are chosen from what the CLIENT already knows -- whether it had
  // launch parameters, whether the server said no, whether the network answered at all. They tell
  // a stranger nothing: the server's reply is one 401 with an empty body in every refusal.
  var launch = launchParams();
  backSupported = atLeast(launch.version, 6, 1) && hasBridge();
  // Telegram's arrow is a header control, so the page has to say what it does with it.
  onBackPressed = function () { if (screen === "week") show("today"); };

  // EACH ASKS ONLY WHERE THE CLIENT CAN ANSWER, and each failure is silence rather than an error.
  // The insets are requested AFTER expand, because expand is what changes the height the client
  // is measuring against -- whether that ordering actually matters on iOS is not documented, so
  // it is on the device checklist rather than assumed.
  if (atLeast(launch.version, 8, 0)) postEvent("web_app_request_safe_area");
  // A vertical drag inside a seven-day list is a scroll, not a dismissal. Without this the week
  // closes the app somewhere around the third day.
  if (atLeast(launch.version, 7, 7)) postEvent("web_app_setup_swipe_behavior", { allow_vertical_swipe: false });
  if (atLeast(launch.version, 6, 10) && hasBridge()) postEvent("web_app_setup_settings_button", { is_visible: true });

  // WHICH ROUTE THIS IS, DERIVED RATHER THAN TEMPLATED. A second per-request substitution in this
  // file would break ci.yml's and drift.yml's deploy proof, which normalise the nonce placeholder
  // and nothing else -- and drift.yml is the replacement for trap 2's dead alarm, so that would
  // take the only live shipping alarm down with it. (Its literal name is deliberately not written
  // here: the Worker substitutes every occurrence in this file, comments included. See the head.)
  // Deriving it here also means / and /web/ serve BYTE-IDENTICAL
  // bytes, which makes the two documents incapable of drifting apart rather than merely unlikely to.
  var web = location.pathname.indexOf("/web/") === 0;

  // !! TEMPORARY DIAGNOSTIC. DELETE WITH THE RULE IT DRAWS.
  // Inserted BEFORE #root so it is the first thing in the scroll view, and in flow so the scroll
  // edge effect can actually reach it -- which is exactly what the fixed version could not do.
  if (web) {
    var probe = el("div", "probe");
    add(probe, el("span", "st"));
    for (var pi = 0; pi < 8; pi++) add(probe, el("b", "p" + (pi * 12), String(pi * 12)));
    document.body.insertBefore(probe, document.body.firstChild);
  }

  // !! THE TOP INSET THE STYLESHEET CANNOT SEE. Measured, not reasoned -- see the comment on the
  // body's padding-top. env(safe-area-inset-top) is 0 in this app in both states, so the page has
  // to work out for itself whether the status bar is currently over it. It is exactly when the
  // viewport is the FULL screen height; once iOS settles the webview below the bar, innerHeight
  // drops by the bar's height and that difference is the inset, which is why it is learned here
  // rather than written as a constant. The 59 is only ever used for the first moments of the very
  // first launch, before a settled measurement exists.
  //
  // !! window.screen, NOT screen. `screen` is this file's own variable for which of the two
  // screens is showing, and it shadows the global -- the diagnostic that found all this reported
  // `screenH=undefined` for exactly that reason.
  var learnedTopInset = 0;
  function syncTopInset() {
    var sh = (window.screen && window.screen.height) || 0;
    var gap = sh - window.innerHeight;
    if (gap > 0) learnedTopInset = gap;
    docEl.style.setProperty("--sa-top", (gap > 0 ? 0 : (learnedTopInset || 59)) + "px");
  }
  syncTopInset();
  // The settle is a resize, and it is the event this exists to catch. Rotation is the other one.
  window.addEventListener("resize", syncTopInset);

  // SKIPPED ON /web/, NOT REPLACED WITH A SECOND EARLY RETURN. There is no launch to have there --
  // the reader is proven by a first-party cookie instead. Returning here would leave them on a
  // blank page, because renderSkeleton is below this line.
  if (!web && !launch.data) {
    render({ ok: false, error: "Open this from your chat with Mochi." });
    return;
  }
  renderSkeleton();
  load();

  function load() {
    return fetch(web ? "/web/s" : "/s", {
      method: "POST",
      body: web ? "" : launch.data,
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      cache: "no-store",
      // !! "same-origin" ON /web/, OR NOTHING WORKS. The session cookie IS the credential there and
      // "omit" drops it -- the symptom is a 401 that reads exactly like a server fault. It stays
      // "omit" on the Telegram path, where the launch travels in the body and no cookie of any kind
      // should ever be sent.
      credentials: web ? "same-origin" : "omit",
    }).then(function (r) {
      if (!r.ok) {
        // ONE 401 WITH AN EMPTY BODY ANSWERS BOTH ROUTES. The difference below is drawn from what
        // the CLIENT already knows, never from the server's reply: on /web/ it means signed out and
        // there is a way in, in Telegram it means the wrong account and there is not.
        render(web
          ? { ok: false, error: "You are signed out. Sign in to see this week.", signin: true }
          : { ok: false, error: "This app is not available for your account." });
        return null;
      }
      return r.json();
    }).then(function (v) {
      if (v) render(v);
    }).catch(function () {
      render({ ok: false, error: "Could not reach the plan. Try again in a moment." });
    });
  }

  // !! THE VIEW IS A SNAPSHOT of the instant the response was built. view.js derives which day is
  // today, the staleness banner, the Now card and `inProgress` from ONE clock, and nothing here
  // ever re-fetched -- so a document kept alive across hours paints a passed time as a live one.
  // "Leave by 04:55" at 09:00, in the largest type on the screen, which is the exact failure
  // view.js has a comment about preventing. An installed app has no pull-to-refresh and no reload
  // button, so there is no gesture that fixes it short of force-quitting from the app switcher.
  //
  // !! WEB ONLY, AND THAT IS NOT A SIMPLIFICATION. Re-fetching inside Telegram re-POSTs the launch
  // credential, which worker.js refuses once it is fifteen minutes old. A resume two hours later
  // would therefore turn a stale-but-readable screen into "not available for your account" -- which
  // reads as an access-control failure and is strictly worse than the staleness. There is no fresh
  // data to be had in that runtime; the honest fix for it is a different change from this one.
  if (web) {
    var hiddenAt = 0;
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
      // A minute, so flicking away and straight back does not re-request on every glance.
      if (hiddenAt && Date.now() - hiddenAt > 60000) { hiddenAt = 0; load(); }
    });
  }
})();
</script>
</body>
</html>
