<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<!--
  THE INSTALLABLE HALF. Inert on the Telegram route and served there anyway, because / and /web/
  must stay BYTE-IDENTICAL: ci.yml and drift.yml prove the deploy by hashing this file with only
  the nonce placeholder normalised, so a second per-request substitution would make those digests
  disagree for ever. Telegram ignores all of it.

  !! DO NOT WRITE THAT PLACEHOLDER'S LITERAL NAME IN A COMMENT. The Worker substitutes EVERY
  occurrence in this file, comments included, so a comment naming it gets a fresh random value on
  every request -- which is the very drift this paragraph is warning about, introduced by the
  paragraph warning about it. Both digests then disagree for ever and the deploy reports red while
  shipping fine. Caught here by the / vs /web/ byte-identical test, which is the only thing that
  would have.

  The title stays "Today" -- worker.http.test.mjs pins that string, and it would be the wrong place
  for the app's name anyway: iOS reads the home-screen label from the manifest and the meta below,
  and truncates it at roughly twelve characters.

  There is deliberately NO static theme-color here. It would be a literal palette value outside the
  three blocks, wrong in two of the three theme states, and watched by nothing. The element is
  created empty pre-paint and syncChrome is its only writer -- see both comments below.
-->
<link rel="manifest" href="/web/app.webmanifest">
<link rel="apple-touch-icon" href="/web/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My plan">
<!--
  !! `default`, AND NOT `black-translucent`. The translucent value looks like the more modern
  choice and is the wrong one here for a reason that is not obvious: it makes the status bar's TEXT
  colour this page's problem, and this page has THREE theme states, one of which is un-stamped and
  follows the OS. There is no single honest choice across all three, and getting it wrong is white
  text on a white ground at 6am -- on the one screen that exists to be readable at 6am.

  Under `default` iOS tints the bar from the theme-color meta, which syncChrome writes out of
  --background, and derives the text colour from that colour's luminance -- so all three states are
  handled without this page ever choosing. `black-translucent` removes the tint: the page shows
  through, the text is light, and in the light theme that is light text on a near-white ground.
  Reasoned, NOT measured, on both halves.

  !! WHAT THE STATUS BAR ACTUALLY DOES HERE WAS MEASURED ON THE PHONE, TWICE, AFTER TWO WRONG
  GUESSES. It does not overlap the page once the app has settled: iOS gives the webview a frame
  BELOW the bar, and innerHeight drops from the full 932 to 873 to prove it. But for the first
  moments of a launch the webview IS the whole screen with the bar drawn over it, and through all
  of it env(safe-area-inset-top) reports 0 -- so nothing in CSS can tell the two apart. That is
  handled by syncTopInset and --sa-top; see the body's padding-top.

  The lesson worth keeping: two earlier attempts at this reasoned from what `default` is
  documented to do and both shipped something wrong. The behaviour only became clear when the page
  was made to print its own numbers.
-->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--
  THE ONE SCREEN, AND THE ONLY DOCUMENT. Served to anyone who asks; it carries the design and the
  renderer and NO TRAINING DATA AT ALL. The week arrives from POST /s, which answers only a launch
  Telegram signed for the one allowed account and returns 401 with an empty body to everyone else.

  IT USED TO BE TWO DOCUMENTS -- a contentless shell that fetched the finished page and replaced
  itself with `document.write` -- so that not even the stylesheet reached a stranger. That is
  IMPOSSIBLE with a CSP nonce and it failed silently: `document.write` does not create a new
  document, so the written markup is judged against the FIRST response's Content-Security-Policy,
  the second response's nonce matches nothing, and every inline <style> and <script> is dropped.
  The result is a blank white page with no error anywhere. Measured on the live site: the two
  responses carried `nonce-kCVb0Cuex5ja4xAcrw7AGQ` and `nonce-iMrWZCXlO8c5cS5ja9WGPQ`.
  Do not split this back into two documents.

  DESIGN: the calvin.sg design system, the same fifteen tokens the weekly artifact is drawn in.
    - NO RAW HEX outside the three palette blocks below. System colours in the forced-colours
      block are not hex and are the one thing a token cannot say.
    - The site defines its tokens ONLY under [data-theme=...]. This page has a THIRD state --
      nothing stamped, which is what a reader who has never chosen a theme is in -- so the
      palette is restated across bare :root, @media (prefers-color-scheme: dark), and
      :root[data-theme=dark]. This is deliberate. Do NOT "fix" it by deleting the bare :root;
      that is the only block that paints for a reader who has never chosen.
    - color-scheme IS PINNED IN BOTH STAMPED STATES, and here that is load-bearing rather than
      defensive. Block 1 declares BOTH schemes, which hands the choice to the OS -- right for
      the un-stamped state, wrong for the two the control at the foot of this page stamps,
      where the page has overruled the OS and the UA has not been told. Unpinned, forcing light
      on a dark phone is a light page with dark scrollbars and dark form controls.
    - THE THIRD STATE IS A STATE THE READER CAN BE IN, so the control offers three and not two.
      A two-state toggle stamps on its first press and can never get back to "follow the
      system" for the life of that browser. The three blocks below already ARE the three
      states: stamp dark, stamp light, or REMOVE the attribute. There is no second palette to
      write and no matchMedia listener to keep, because block 2 is a media query -- an OS that
      changes under an un-stamped page is handled in CSS with no script running at all.
    - THIS PAGE IS THE DONOR. weekly-training-plan's design-system reference sends every plan
      artifact here to lift the palette, because it is the same system already shaped for an
      embedded page. A defect here is copied into next week's artifact.

  THE ONE ELEVATED SURFACE IS THE NAVIGATION. Everything else on this page lies flat on the
  ground: no plate, no shadow, no second floating layer. The design system spends its offset
  plate on a CONTROL's affordance, and the cards here are inert -- so a plated card was
  signalling "press me" on something with nothing to press. A BORDER marks an aside: the banner
  is a statement ABOUT the plan, and `After today` is a different day. The plan itself is unboxed.
-->
<style nonce="__NONCE__">
/* ── palette, block 1 of 3: bare :root. Light, and the un-stamped default. ──────────────── */
:root{
  --background:#fafafa; --card-background:#f5f5f5; --card-border:#e5e5e5;
  --shadow:#a82334; --accent:#a82334; --text:#0b0b0b;
  --progress-fill:#a82334; --progress-track:#e3b3b8;
  --status-live:#a82334; --status-halo:#a82334; --brand-ink:#a82334;
  --sport-ride:#a82334; --sport-ride-on-ink:#f3a3aa;
  --sport-run:#1f4e9c;  --sport-run-on-ink:#9fc0f0;
  color-scheme:light dark;
}
/* ── palette, block 2 of 3: the viewer's system preference, with no attribute stamped. ──── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
    --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
    --progress-fill:#f9cdd3; --progress-track:#462f32;
    --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
    --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
    --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  }
}
/* ── palette, block 3 of 3: an explicit choice, which must beat the media query. ────────── */
:root[data-theme=dark]{
  --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
  --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
  --progress-fill:#f9cdd3; --progress-track:#462f32;
  --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
  --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
  --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  color-scheme:dark;
}
/* The light stamp takes color-scheme AND NOTHING ELSE. Its VALUES already resolve correctly --
   block 1 supplies them, and block 2 is suppressed by its own :not([data-theme=light]) guard --
   so a fourth copy of the light token list would be a copy with no runtime reason to exist,
   which is the one thing the design system forbids outright. Specificity needs no reordering:
   this is (0,2,0) and beats block 1's bare :root. */
:root[data-theme=light]{ color-scheme:light; }

/* ── derived, as the site derives them ─────────────────────────────────────────────────── */
:root{
  --hairline:color-mix(in srgb, var(--text) 32%, transparent);
  --quiet:  color-mix(in srgb, var(--text) 62%, transparent);
  --quieter:color-mix(in srgb, var(--text) 42%, transparent);
  --fill:   color-mix(in srgb, var(--text)  6%, transparent);
  --radius-card:.5rem; --plate:2px 2px 0 var(--shadow);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --nav-h:3.5rem;

  /* !! BOTH TERMS ARE LOAD-BEARING, AND EACH IS DEAD IN THE RUNTIME THE OTHER IS ALIVE IN.
     Inside Telegram's iOS webview `env(safe-area-inset-bottom)` resolves to 0 -- measured, and
     open upstream as Telegram-iOS#1377 -- so the real inset can only arrive over the bridge, as
     `safe_area_changed`, which the script below writes into --sa-bottom. In a plain browser and
     in a home-screen web app there is NO bridge, --sa-bottom is never set, and env() is the only
     thing that knows about the home indicator.
     So: do not "simplify" this to one term. Whichever runtime you happen to be testing in, the
     other term looks redundant and deleting it puts the navigation under the home indicator on
     every device that uses the half you removed. The floor keeps the pill off the screen edge
     where both are zero. */
  --nav-inset:max(var(--sa-bottom, 0px), env(safe-area-inset-bottom), 0.5rem);
}

/* !! TEMPORARY DIAGNOSTIC, SECOND ATTEMPT. DELETE ALL OF IT.
   The first ruler was position:fixed and therefore INVISIBLE to the thing it was measuring: iOS 26's
   scroll edge effect blurs a scroll view's CONTENT, and a fixed element is not part of that content.
   It read 254.8 crisp at every depth while the header two lines away was visibly out of focus.
   So this one sits in NORMAL FLOW, as the first thing in the body, with the body's top padding
   temporarily zeroed so row 0 really is the top of the scroll view.
   Fine 2px stripes on the left, because a blur destroys a fine pattern where it leaves flat colour
   looking untouched. Twelve-pixel rows, labelled with their offset, so the depth can be read off
   directly rather than bracketed. The change that reads this deletes it. */
.probe{position:relative; height:6rem; margin:0 0 1rem 0}
.probe .st{position:absolute; top:0; bottom:0; left:0; width:50%;
  background:repeating-linear-gradient(to bottom, black 0 2px, white 2px 4px)}
.probe b{position:absolute; right:0; width:50%; height:.75rem; text-align:center;
  font:700 .625rem/.75rem var(--sans); color:white; background:firebrick}
.p0{top:0}.p12{top:.75rem}.p24{top:1.5rem}.p36{top:2.25rem}
.p48{top:3rem}.p60{top:3.75rem}.p72{top:4.5rem}.p84{top:5.25rem}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--background); color:var(--text);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  /* ALL FOUR EDGES, and three of them were missing. The foot clears the floating navigation,
     which is fixed and therefore out of flow. The other three are the device's own cutouts:
     `viewport-fit=cover` is set on the viewport meta, which means this page is responsible for
     the notch and the rounded corners rather than the browser.
     Inside Telegram this never bit -- its webview sits below the status bar, so the top inset
     resolves to 0 and the omission was invisible. The same document served as a home-screen web
     app owns the whole screen, and there the header renders under the Dynamic Island.
     `max()` rather than a bare env() so the page keeps its own margin where the inset is 0,
     which is the same floor-not-fallback shape --nav-inset uses.
     !! THIS TOP FLOOR IS NOT ENOUGH IN THE INSTALLED APP -- measured on the phone, the header
     still rendered under the Dynamic Island. The rule immediately below raises it there, and
     ONLY there. Do not raise it here instead: Telegram's route is correct today and a global
     floor would give it sixty pixels of dead space at the top of every screen. */
  /* !! THE TOP INSET IS THE ONE EDGE env() DOES NOT KNOW ABOUT, AND THAT IS MEASURED.
     On Calvin's phone, in the installed app, env(safe-area-inset-top) reports 0 in BOTH of the
     two states below, while env(safe-area-inset-bottom) correctly reports 34 once settled. So
     the other three edges can trust env() and this one cannot; --sa-top is what fills the gap,
     written by syncTopInset near the foot of the script.
     THE TWO STATES: on launch the webview is briefly the WHOLE screen -- innerHeight 932 of 932
     -- with the status bar drawn over it, and a moment later iOS settles it to 873 with the page
     below the bar. Padding sized for one state is wrong in the other, and this is the whole of
     the defect that was reported as the header being washed out "upon first page open": at 20px
     it spent that moment underneath the status bar.
     ADDITIVE, not max(). The inset and the page's own margin are not alternatives -- one clears
     the hardware, the other is the design's breathing room, and the header wants both. max() of
     the two sources rather than of the margin: whichever source actually knows the inset wins,
     and they never double count because only one is ever non-zero. */
  padding-top:calc(max(env(safe-area-inset-top), var(--sa-top, 0px)) + 1.25rem);
  /* TEMPORARY: the probe below has to start at the exact top of the scroll view. */
  padding-top:0;
  padding-right:max(1rem, env(safe-area-inset-right));
  padding-left:max(1rem, env(safe-area-inset-left));
  padding-bottom:calc(var(--nav-h) + var(--nav-inset) + 1.5rem);
  /* 320 px is the floor this must work at. Everything below sizes off the viewport, never a
     fixed width, and the one long-word field (place) gets an explicit break. */
  max-width:34rem; margin-inline:auto;
}


/* THE ONLY TWO PLACES A TRACKED-OUT CAPITAL RUN SURVIVES. It was on eleven, across the week
   label, every card's kind, the clock's own label, both definition terms and the why block --
   which is a capital run above almost every group on the screen, and the commonest thing that
   makes a considered page read as a generated one. The rule that replaced it: `.mc` is for a
   short word that labels a value INLINE and would otherwise be read as the value. Everything
   else carries its hierarchy with size, weight and colour off the ramp. */
.mc{font-size:.625rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}

header{display:flex; flex-wrap:wrap; gap:.25rem 1rem; align-items:baseline; margin-bottom:1.75rem}
header .week{color:var(--quiet); font-size:.8125rem}
header .asof{color:var(--quieter); font-size:.75rem; margin-left:auto}

/* The banner is the honesty surface. It appears ONLY when something is actually wrong, so its
   presence is information -- a banner that is always there is furniture. It is BOXED because a
   border here marks an aside: this is a statement about the plan rather than part of it. */
.banner{
  border:1px solid var(--accent); border-radius:var(--radius-card);
  background:var(--fill); padding:.75rem .875rem; margin-bottom:1.5rem;
}
.banner .mc{color:var(--accent); display:block; margin-bottom:.25rem}
.banner p{margin:0; font-size:.875rem}
/* THE WAY BACK IN, DRAWN AS A CONTROL RATHER THAN A SENTENCE. An installed app has no address bar,
   so "open today.calvin.sg/web/signin" is an instruction the reader cannot act on. It lives inside
   the banner because being signed out IS the statement the banner is making. */
.banner a.signin{
  display:inline-block; margin-top:.625rem; padding:.5rem .875rem;
  font-size:.875rem; font-weight:600; text-decoration:none;
  color:var(--background); background:var(--accent); border-radius:var(--radius-card);
}
.banner a.signin:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── the hero ──────────────────────────────────────────────────────────────────────────────
   UNBOXED, AND WITHOUT THE PLATE. It used to be a bordered card wearing `2px 2px 0` -- but the
   design system spends that offset plate on a CONTROL's one action, and this card has no link
   and no button in it. A plate here was an affordance drawn on something inert, and a border
   around the one thing this screen exists to show was a box around the whole page. Standing it
   on the ground is also what leaves the navigation as the only raised surface. */
.hero{margin:0 0 1.75rem 0}
.hero .kind{color:var(--quiet); font-size:.8125rem; display:block; margin-bottom:.25rem}
h1{font-size:1.375rem; line-height:1.25; margin:0 0 1rem 0; font-weight:600; letter-spacing:-.01em}

/* THE NUMBER. The one element on this screen that has to be readable at arm's length at 6am,
   which is the whole reason the app exists. It scales with the viewport and is capped so it
   cannot wrap at 320 px. */
.clock{margin:0 0 1rem 0}
.clock .label{color:var(--quiet); display:block; font-size:.9375rem; margin-bottom:.125rem}
.clock time{
  display:block; font-size:clamp(3rem, 17vw, 4.25rem); line-height:1;
  font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
  color:var(--accent);
}
/* The window used to read "Sun 7 Sep <middot> 05:30-08:00", joining a date to a span with a
   glyph. They are two different facts, so they are two columns with space between them and no
   punctuation doing the work of layout. */
.clock .window{
  color:var(--quiet); font-size:.8125rem; margin-top:.5rem;
  display:flex; flex-wrap:wrap; gap:.15rem 1rem;
}
.clock .window .span{font-variant-numeric:tabular-nums}

dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.375rem .75rem; align-items:baseline}
dt{color:var(--quieter); white-space:nowrap; font-size:.875rem}
dd{margin:0; font-size:.9375rem; overflow-wrap:anywhere}

/* The session's figures on the hero. Same list and same class as a week row -- a figure reads the
   same on both screens -- with one step of size back: this screen has the room, and the numbers
   are the prescription rather than a footnote. `.figs` itself is declared with the week screen,
   which is where it is used seven times over. */
.hero .figs{margin-top:1rem}
.hero .figs li{font-size:.875rem}

.rule{border:0; border-top:1px solid var(--hairline); margin:1.125rem 0}
.onerule{margin:0; font-size:1rem; line-height:1.45}
.bring{margin:.875rem 0 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.375rem}
.bring li{border:1px solid var(--hairline); border-radius:2px; padding:.125rem .5rem; font-size:.8125rem}

.next{display:flex; flex-wrap:wrap; gap:.25rem .625rem; align-items:baseline}
.next .when{color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap}
.next .what{font-size:.9375rem}
.later{color:var(--quieter); font-size:.8125rem; margin:.5rem 0 0 0}

.why{color:var(--quiet); font-size:.875rem; line-height:1.55; margin:1.25rem 0 0 0}
.why b{display:block; color:var(--quieter); font-weight:600; margin-bottom:.25rem}

/* A DIFFERENT DAY, and the second of the two things a border marks. Everything belonging to
   today stands on the ground; this is outside today's window, so it is set apart by a box. */
.card{
  border:1px solid var(--card-border); border-radius:var(--radius-card);
  background:var(--card-background); padding:1.125rem 1rem; margin:1.75rem 0 0 0;
}
.card .kind{color:var(--quiet); font-size:.8125rem; display:block; margin-bottom:.5rem}

footer.credit{margin-top:1.75rem; color:var(--quieter); font-size:.6875rem}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
/* THE SCREEN CONTAINER IS NOT A CONTROL. Swapping screens moves focus here so a reader driving the
   page by keyboard or screen reader lands at the top of what just replaced the page, rather than
   wherever the old markup left them -- but `#root` is tabindex="-1", is not in the tab order, and
   is never focused by a person. The ring is a control's affordance, and drawn around the whole
   viewport it reads as an error state. The focus MOVE is the accessible behaviour; the ring is not
   part of it. */
#root:focus,#root:focus-visible{outline:none}

/* ── the theme control ─────────────────────────────────────────────────────────────────────
   THE SITE'S `chip` AND `chip-icon`, WRITTEN OUT. The classes do not travel -- this page loads
   no stylesheet from calvin.sg and never could -- so what transfers is the vocabulary: the
   quiet surface at a hairline of the ink, no plate, 2.75rem on both axes, and the inverted fill
   for the option that is current. The plate is this design's mark for a page's ONE action, and
   setting a preference is furniture, so furniture recedes and the number stays the loudest
   thing on the screen. It sits at the FOOT for the same reason: at 6am the plan is what the
   eye and the keyboard should meet first.

   IT IS ALWAYS DRAWN, ON EVERY CLIENT. Telegram's settings gear is offered as a SHORTCUT to it
   where the client has one, and is never the only way to reach it -- see `wireSettingsButton`
   below for why that distinction is the whole lesson of the dead back arrow.

   THREE EXCLUSIVE STATES ARE NOT A TOGGLE BUTTON. The site's control reports a pressed state,
   which is right for two; the WAI-ARIA pattern for a set of three is the radio group. These
   are native radios, so the grouping, the checked state and the arrow-key roving are the
   platform's rather than a re-implementation of them, and the label is the whole target.

   THE MARK SET IS CLOSED. It ships a sun and a moon and nothing that means "follow the
   system", so that option is drawn as a WORD -- never an emoji, never a second icon family. */
.sr-only,.theme input{
  position:absolute; width:1px; height:1px; padding:0; margin:0; overflow:hidden;
  clip-path:inset(50%); white-space:nowrap; border:0;
}
.chrome{margin-top:2rem}
.theme{position:relative; display:flex; flex-wrap:wrap; gap:.5rem; border:0; margin:0; padding:0; min-inline-size:0}
/* THE SURFACE IS SHARED; THE STATE MACHINE IS NOT. `.chip` here is the navigation control between
   the two screens, and it wears the same quiet box as a theme option because the site's vocabulary
   says both are the same KIND -- chrome: getting somewhere, and setting a preference.
   What is NOT shared is everything below that depends on `input:checked + label`. A nav chip is a
   <button> with no adjacent radio, so there is no sibling for those selectors to match, and the
   ORDER they sit in relative to the press rule is load-bearing for the theme control alone. Adding
   `.chip` to the base, the hover and the press is the whole of the sharing. */
.theme label,.chip{
  display:inline-flex; align-items:center; justify-content:center; gap:.4em;
  /* 2.75rem on BOTH axes: the enhanced target size, in rem so it grows with the reader's own
     text rather than pinning a box in pixels the text then outgrows. */
  min-height:2.75rem; min-width:2.75rem; padding:.3rem .7rem;
  border:1px solid var(--hairline); border-radius:2px;
  background:var(--background); color:var(--text); cursor:pointer;
  /* A <label> inherits the page's face; a <button> does NOT -- it takes the UA's own control font
     and would arrive a step off the type ramp beside an identical-looking theme chip. */
  font-family:inherit; appearance:none; -webkit-appearance:none;
  font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:color .3s cubic-bezier(.4,0,.2,1), background-color .3s cubic-bezier(.4,0,.2,1),
             border-color .3s cubic-bezier(.4,0,.2,1);
}
/* The glyph box is PINNED where the labelled one is floored: a label comes from the vocabulary
   and must be allowed to grow, a mark is a size the design picked. */
.theme label.glyph{width:2.75rem; height:2.75rem; padding:0}
.theme svg{width:1.25rem; height:1.25rem; display:block; fill:currentColor}
/* Guarded, because a touch browser applies :hover on tap and holds it until something else is
   tapped -- which would leave the last option pressed wearing the accent beside the one that is
   genuinely current, faking the exact distinction this row exists to draw. */
@media (hover: hover){
  .theme label:hover,.chip:hover{border-color:var(--accent); color:var(--accent)}
}
/* The current option, in the site's own inverted treatment. */
.theme input:checked + label{background:var(--text); border-color:var(--text); color:var(--background)}
/* A press shows something on EVERY option including the current one, and it SNAPS: a tap is
   over in about 100ms against a 300ms ramp, so an eased press is drawn about a third of the way
   and then undrawn. Below the checked rule on purpose, so the option you are already on also
   answers the finger. */
.theme label:active,.chip:active{border-color:var(--accent); color:var(--accent); transition:none}
/* ...and the option you are already on keeps its readable ink, because accent on the --text
   flood measures 2.77:1 light and 1.37:1 dark. The accent border still says the tap landed. */
.theme input:checked + label:active{color:var(--background); transition:none}
/* Focus gets its own rule and is never listed with hover: hover is a pointer's affordance and
   some readers have no pointer. The ring goes on the label because the input is the 1px box. */
.theme input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
/* THE SWAP SNAPS, and this is the same rule as the press one above rather than a new idea.
   The 300ms ramp is the chip's hover and press affordance; a THEME change moves every token
   under it at once, so without this the ground flips instantly while the chips ease across for
   a third of a second -- measured in the browser, the chips still resolving the OLD palette's
   #111111 on the NEW palette's #fafafa ground. That is an acknowledgement of the press fading
   in after the press, which is the one thing this design says a press must never do. Set for
   exactly one forced reflow by the script below, so hover and press keep their ramp. */
:root[data-swapping] .theme label,:root[data-swapping] .chip{transition:none}
/* A forced-colours mode replaces every author colour, so the inverted fill -- the only thing
   saying which option is current -- would arrive blank. The marks need nothing: they are inline
   SVG filled with currentColor, not a mask over a background the mode overrides. */
@media (forced-colors: active){
  .theme input:checked + label{
    forced-color-adjust:none; background:Highlight; border-color:CanvasText; color:HighlightText;
  }
}

/* ── the navigation ────────────────────────────────────────────────────────────────────────
   THE ONE PIECE OF CHROME THAT FLOATS, and the only raised surface on the page. It replaced
   three scroll-dependent controls: a chip below the whole plan that got you INTO the week, and
   two more at the head and foot of the week that got you back out. All three could be off
   screen at the moment they were wanted.

   IT IS NOT CONDITIONAL ON THE BRIDGE, and that is the point rather than an implementation
   detail. Telegram's back arrow was once the only way off the week on clients that could draw
   it -- and on a real iPhone it rendered, did nothing, and left the screen a dead end. A way
   back does not get to depend on something that can lie about working. This bar is drawn by
   this page, from this page's own data, and is on screen at every scroll position.

   NOT THE ARIA TABS PATTERN. `role="tablist"` here and `role="tabpanel"` on #root would have
   been correct as a widget and wrong as a document: an explicit role REPLACES the host
   language's own, so the page would have lost both its nav landmark and its main landmark to
   describe a two-item switcher. Two buttons and `aria-current` say the same thing and cost no
   landmark, no roving tabindex and no activation model. */
.navbar{
  position:fixed; left:0; right:0; bottom:var(--nav-inset);
  display:flex; justify-content:center;
  /* The bar spans the viewport so the pill can centre in it, but only the pill is a target --
     without this the invisible half of the bar eats taps meant for the page behind it. */
  pointer-events:none; z-index:10;
  padding:0 1rem;
}

/* ── the scroll edge effect ────────────────────────────────────────────────────────────────
   APPLE'S OWN MECHANISM, AND THE SYSTEM DOES NOT SUPPLY IT TO A CUSTOM BAR: "If you use custom
   bars, you might want to add this effect manually." This one is custom, so it is manual.

   WHAT IT IS FOR, in Apple's words, because it is easy to build the wrong thing: "Only use a
   scroll edge effect when a scroll view is behind floating interface elements. Scroll edge
   effects aren't decorative. They DON'T BLOCK OR DARKEN LIKE OVERLAYS; they exist to ensure
   controls stay visually distinct."

   So this is NOT a scrim. It is the page's own ground, opaque at the foot and fading upward, so
   content dissolves into the page before it reaches the pill rather than passing behind it
   half-legible. A darkening overlay would be the decorative version and is the thing the
   guidance rules out.

   IT IS HERE BECAUSE OF A MEASUREMENT, not a guideline. On Calvin's own iPhone, on his own data,
   the capsule sat over the "why this session" paragraph and ate characters out of it -- "with
   the la_t _ilometre at 149 to 153", and in Safari "you top ___ ___ ___" where the text reads
   "you top out near 137". This app's prose is unusually NUMBER-DENSE, so the characters
   translucency costs are the ones carrying the meaning: "157, 158 and 157" degrades far worse
   than ordinary prose does. Increase Contrast only helps a reader who has turned it on; this
   helps every reader, always, which is why it is the fix and that one was not.

   !! IT IS THE ONLY GRADIENT ON THIS PAGE, and the design system has none anywhere else. That is
   deliberate rather than an oversight being excused: everything calvin.sg draws is flat, and the
   one place this file departs is the one component already speaking the platform's language
   instead of this site's. It introduces NO colour of its own -- both stops are --background, one
   of them thinned with color-mix -- so it stays inside the palette rule even while it steps
   outside the flatness one. Apple's own note that the effect is not decorative is the whole
   justification; spend it here and nowhere else.

   !! Attached to `.navbar` as a pseudo-element so it inherits `[hidden]` and `pointer-events`.
   A separate element would need both wired by hand and would drift out of step with the bar the
   first time one of them moved. `position:fixed` anchors it to the viewport rather than to the
   navbar's own short box, and being out of flow it is not a flex item. */
.navbar::before{
  content:""; position:fixed; left:0; right:0; bottom:0;
  height:calc(var(--nav-h) + var(--nav-inset) + 1.75rem);
  background:linear-gradient(to top,
    var(--background) 0%,
    color-mix(in srgb, var(--background) 82%, transparent) 45%,
    transparent 100%);
}
/* A forced-colours mode replaces every author colour, so the gradient arrives as a flat block of
   something the reader did not choose -- and it is not needed there, because the pill has already
   taken a solid Canvas ground and a CanvasText edge, which is the separation this exists to
   provide. Removed rather than recoloured. */
@media (forced-colors: active){
  .navbar::before{display:none}
}
/* THIS RULE IS THE ONLY THING THAT MAKES `hidden` WORK ON THIS ELEMENT, and without it the
   attribute is set and does nothing. `hidden` is implemented as a UA-stylesheet `[hidden]{display:
   none}` at the lowest specificity there is, and the rule above sets `display:flex` on a CLASS --
   (0,1,0) beats it. So `navEl.hidden = true` stamped the attribute, the flex container kept its
   box, and the refusal screen drew an EMPTY 9-pixel glass sliver with no tabs in it.
   Measured on the live site by a parallel session -- height 9, width 581, zero buttons -- on both
   the Telegram refusal and the signed-out /web/ screen. Shipped in #27 and invisible to 178 tests,
   because nothing in this suite renders the DOM: `hidden` was set correctly and asserted nowhere.
   Do not "simplify" this away as redundant with the attribute. It IS the attribute. */
.navbar[hidden]{display:none}
/* ── the material: STOCK APPLE, NOT THIS SITE'S SYSTEM ─────────────────────────────────────
   The bar below is the one thing on this page drawn in the platform's own language rather than
   calvin.sg's, and that is a decision rather than a drift. Everything else here is flat, has a
   hairline at a fraction of the ink, and carries no shadow; a Liquid Glass tab bar is
   translucent, has a specular rim, a separation shadow and a tinted selection capsule, and it
   is none of those things by accident. Mapping it onto the fifteen tokens produced something
   that was neither -- so it is drawn in Apple's values instead.

   THIS IS THE ONLY BLOCK ON THE PAGE ALLOWED RAW COLOUR. They are the system's own material
   and label values, they are not part of this site's palette, and they must not leak: nothing
   outside `.navbar` may reference them, and no token here may be reused elsewhere. The three
   palette blocks at the top of this file remain the whole of the design system, which is what
   keeps this page usable as the donor every weekly artifact lifts from.

   THE THEME STATES ARE THE PAGE'S OWN THREE, restated for exactly the same reason: light with
   nothing stamped, the OS preference, and an explicit stamp that must beat the media query.
   Apple's dark material is not its light material darkened -- the rim goes from near-opaque
   white to a faint one, and the shadow roughly quadruples. */
.navbar{
  --tab-material:rgba(255,255,255,.72);
  --tab-edge:rgba(0,0,0,.08);
  --tab-rim:rgba(255,255,255,.75);
  --tab-shadow:0 6px 24px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
  --tab-label:rgba(60,60,67,.6);
  --tab-selected:rgba(120,120,128,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]) .navbar{
    --tab-material:rgba(28,28,30,.72);
    --tab-edge:rgba(255,255,255,.12);
    --tab-rim:rgba(255,255,255,.14);
    --tab-shadow:0 6px 24px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
    --tab-label:rgba(235,235,245,.6);
    --tab-selected:rgba(120,120,128,.32);
  }
}
:root[data-theme=dark] .navbar{
  --tab-material:rgba(28,28,30,.72);
  --tab-edge:rgba(255,255,255,.12);
  --tab-rim:rgba(255,255,255,.14);
  --tab-shadow:0 6px 24px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  --tab-label:rgba(235,235,245,.6);
  --tab-selected:rgba(120,120,128,.32);
}

.navbar .pill{
  pointer-events:auto;
  display:inline-flex; gap:.125rem; padding:.25rem;
  border-radius:999px;
  background:var(--tab-material);
  /* A hairline edge and a specular rim are two different things and both are the material:
     the edge separates the capsule from whatever is behind it, the inset rim is the light
     catching its top lip. Drawn together in one box-shadow with the separation shadow. */
  border:.5px solid var(--tab-edge);
  box-shadow:inset 0 .5px 0 var(--tab-rim), var(--tab-shadow);
  /* Apple's own figures: a heavy blur with the backdrop saturated well past 100%, which is what
     makes the material read as glass rather than as frosted plastic. */
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  transition:padding .3s cubic-bezier(.32,.72,0,1);
}
/* THE LABELS ARE THE PLATFORM'S, NOT THIS SITE'S. `.chip` sets tracked-out uppercase, which is
   the calvin.sg control vocabulary and is wrong here -- a system tab bar is sentence case, small,
   medium weight, with no tracking at all, and it stacks a mark ABOVE the word rather than beside
   it. Apple's guidance is explicit on both: "Include tab labels... Use single words whenever
   possible", and in a compact view "tab bar icons appear above tab labels". The class stays for
   the surface it shares with the theme control; everything that would make it look like this
   site is undone. */
.navbar .chip{
  border:0; background:transparent; border-radius:999px;
  flex-direction:column; gap:.1rem;
  padding:.3125rem 1rem;
  text-transform:none; letter-spacing:normal;
  font-size:.6875rem; font-weight:500; line-height:1.1;
  color:var(--tab-label);
  transition:color .2s cubic-bezier(.32,.72,0,1), background-color .2s cubic-bezier(.32,.72,0,1);
}
/* Drawn rather than fetched, at the 24-grid the rest of this page's marks use, in SF Symbols'
   geometry: a round-capped stroke on an even weight. Stroked rather than filled, which is the one
   place these depart from Apple's "prefer filled symbols" -- a filled clock needs its hands
   knocked out of the disc with an even-odd winding, and a knockout that is subtly wrong reads as
   a smudge at 22px, where a stroke cannot. The tint carries the selected state instead. */
.navbar .tabmark{
  width:1.375rem; height:1.375rem; display:block; flex:none;
  fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round;
}
.navbar .lbl{display:block}
/* The selected tab is a filled capsule behind the label, and the label takes the app's own tint
   -- which IS the stock behaviour: every system tab bar is tinted by the app it belongs to, and
   for this one that is the accent. The ink inversion this used to wear is a calvin.sg idiom and
   has been dropped along with the rest of them. */
.navbar .chip[aria-current=page]{background:var(--tab-selected); color:var(--accent)}
@media (hover: hover){
  .navbar .chip:hover{color:var(--accent); border-color:transparent}
}
.navbar .chip:active{border-color:transparent; transform:scale(.96)}
.navbar .chip[aria-current=page]:active{color:var(--accent)}

/* MINIMISED, THE WAY THE PLATFORM'S OWN BAR SHRINKS ON A SCROLL DOWN -- with one difference that
   is not negotiable. The system bar collapses its labels to icons; there is no icon here for
   either screen, and one tab wearing a mark beside another wearing a word is worse than neither
   having one. So both words stay at every size and only the space around them goes.
   THE TARGET IS FLOORED, NOT SHRUNK. `min-height` and `min-width` stay at 2.75rem, the enhanced
   target size. A navigation whose hit area gets smaller as you read is a defect at 6am, not a
   flourish. Only the padding and the type step move. */
.navbar[data-min] .pill{padding:.125rem}
.navbar[data-min] .chip{padding:.3125rem .875rem}
.navbar[data-min] .lbl{display:none}

/* THE GLASS IS AN ENHANCEMENT AND FAILS TO A SOLID SURFACE, never to a transparent one -- a pill
   with no ground floating over scrolling text is unreadable rather than merely plain. The solid
   fallback is the one place the bar borrows from this page's palette, because an opaque surface
   under this page's own text has to agree with this page's own ground.
   Apple names THREE settings that change a Liquid Glass surface: reduce transparency, increase
   contrast, and the reader's own preferred look for the material. All four blocks below are here
   because of that list, and they do not all fire on the platform this page is for:

     @supports not (backdrop-filter)  -- fires: an old WebKit with no blur at all
     prefers-contrast: more           -- FIRES on iOS. Increase Contrast maps to it
     prefers-reduced-transparency     -- does NOT fire: unimplemented in WebKit as of Safari 26.6
     forced-colors: active            -- fires

   The reduced-transparency query ships anyway because it costs nothing and becomes correct the
   day WebKit implements it. `prefers-contrast` is the one that was MISSING, and it is the one of
   the three that a reader on this platform can actually turn on today -- so the bar was ignoring
   the only one of Apple's three accessibility settings that reaches it. It gets a firmer edge as
   well as a solid ground, because Increase Contrast is a request for definition and not merely
   for opacity: --hairline is 32% of the ink and --text is the ink itself. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .navbar .pill{background:var(--card-background); border-color:var(--card-border)}
}
@media (prefers-contrast: more){
  .navbar .pill{
    background:var(--card-background); border-color:var(--text);
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  .navbar .chip{color:var(--text)}
  .navbar .chip[aria-current=page]{background:var(--text); color:var(--background)}
}
@media (prefers-reduced-transparency: reduce){
  .navbar .pill{background:var(--card-background); border-color:var(--card-border)}
}
@media (forced-colors: active){
  .navbar .pill{background:Canvas; border-color:CanvasText; box-shadow:none}
  .navbar .chip{color:CanvasText}
  .navbar .chip[aria-current=page]{
    forced-color-adjust:none; background:Highlight; color:HighlightText;
  }
}

/* ── the skeleton ──────────────────────────────────────────────────────────────────────────
   WHAT STANDS IN THE HERO'S PLACE WHILE /s IS IN FLIGHT. It used to be nothing at all: a white
   page, indistinguishable from one that failed to load, for as long as the network took.
   It is STILL, not shimmering. This design's rule is that information is never carried in
   motion alone, and "still loading" is information -- so it has to be legible in a frozen frame,
   which is also what a reader with reduced motion gets. */
.skel{margin:0 0 1.75rem 0}
.skel span{display:block; background:var(--fill); border-radius:2px}
.skel .s-kind{width:5rem; height:.8125rem; margin-bottom:.75rem}
.skel .s-title{width:70%; height:1.375rem; margin-bottom:1.25rem}
.skel .s-label{width:4.5rem; height:.9375rem; margin-bottom:.5rem}
.skel .s-clock{width:9rem; height:clamp(3rem, 17vw, 4.25rem); margin-bottom:.75rem}
.skel .s-win{width:12rem; height:.8125rem}

/* ── the week screen ───────────────────────────────────────────────────────────────────────
   The second screen, and everything below is only ever on it. It is a LIST, where the Now screen
   is a single card: the reader is scanning seven days rather than reading one number, so nothing
   here is allowed to compete with `.clock` for weight -- the two screens share a palette and a
   type ramp, not a hierarchy. */
/* The week screen's own name. It is an `h1` -- one per screen -- so the ramp above already sets
   it; the ONLY thing that differs is the space beneath, because the Kiprun line belongs to this
   heading rather than to the gauge. Restating the ramp here would be a second copy of a size that
   is already decided, and this rule was briefly written as `h2.weekhead`, which matched nothing. */
.weekhead{margin:0 0 .25rem 0}
.race{color:var(--quiet); font-size:.8125rem; margin:0 0 1.5rem 0}

/* THE GAUGE. The design system's rule for a quantity: a flat two-pixel stroke, the marked region
   over the remainder, and the scale named IN WORDS BEFORE the bar -- a length means nothing until
   the reader knows what it is measured against. The number is printed as well as drawn, because a
   bar is a shape and the reader who cannot resolve the shape is the one who most needs the value.
   No ink goes inside the bar: the fill flips polarity between the themes. */
.gauge{margin:0 0 1.75rem 0}
.gauge .scale{display:block; margin-bottom:.5rem; font-size:.9375rem}
.gauge .scale b{font-weight:600; font-variant-numeric:tabular-nums}
.gauge .bar{display:block; height:2px; background:var(--progress-track); overflow:hidden}
.gauge .bar i{display:block; height:2px; background:var(--progress-fill)}
.gauge .step{color:var(--quiet); font-size:.8125rem; margin:.5rem 0 0 0}
/* A quantity nobody published is drawn as an ABSENCE and named, never as a zero-length bar --
   a measured zero and an unmeasured value are different facts and only the undrawn one can say so. */
.gauge .absent{color:var(--quieter); font-size:.8125rem; margin:.5rem 0 0 0}

.day{padding:1.125rem 0 0 0; border-top:1px solid var(--card-border)}
.day:first-of-type{border-top:0; padding-top:0}
/* TODAY, DRAWN IN FULL ON THE FIRST SCREEN. It is `.day` in every respect but the class, and the
   class is separate for one measured reason: `.day:first-of-type` above strips the rule and the
   space from the first day of the week, and on the Today screen this section IS the first one --
   so sharing the class would silently delete the only thing separating it from the hero above it.
   Everything inside it (`.dhead`, `.tag`, `.slots`, `.bed`, `.pastline`) is styled by its own class
   and needs nothing further. */
.dayfull{margin:1.75rem 0 0 0; padding-top:1.375rem; border-top:1px solid var(--card-border)}
/* The day's own head. The date, its one-word character and the today marker are three different
   facts, so they sit in a row with space between them rather than being strung together with a
   punctuation glyph. */
.dhead{display:flex; flex-wrap:wrap; gap:.375rem .75rem; align-items:baseline;
       margin:0 0 .75rem 0; font-size:.9375rem; font-weight:600}
.dhead .d{white-space:nowrap}
/* The day's one-word character, in the same hairline bib the hero's `bring` list wears. */
.tag{border:1px solid var(--hairline); border-radius:2px; padding:.05rem .4rem;
     font-size:.6875rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
     color:var(--quiet)}
/* Today is marked by a DOT AND A WORD. The dot alone would be information carried in colour, which
   a forced-colours mode replaces, and in a shape a reader may not read as current. */
.dhead .today{color:var(--status-live); display:inline-flex; align-items:center; gap:.3em;
              font-size:.6875rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
.dhead .today::before{content:""; width:.5rem; height:.5rem; border-radius:50%;
                      background:var(--status-live); flex:none}

.slots{margin:0; padding:0; list-style:none; display:grid; gap:.875rem}
.slot{display:grid; grid-template-columns:3.4rem 1fr; gap:.125rem .625rem}
.slot .t{color:var(--accent); font-variant-numeric:tabular-nums; font-size:.875rem; white-space:nowrap}
/* The end time sits UNDER the start rather than beside it, so the column stays narrow enough to
   leave a readable measure for the session at 320px -- which is the width this page is written to. */
.slot .t .to{display:block; color:var(--quieter); font-size:.75rem}
/* An untimed session is a NOTE attached to the day -- a kit list, a fuel plan, a rest by design --
   not an appointment. It keeps the column so the titles stay aligned, and says so rather than
   showing a blank where a clock would be. */
.slot .t--none{color:var(--quieter)}
/* `min-width:0` because a grid item refuses to shrink below its longest word by default, and a
   venue or a session name from upstream is not a string this page gets to choose the length of.
   Same defence `dd` already carries on the Today screen, for the same reason. */
.sbody{min-width:0; display:grid; gap:.25rem; align-content:start}
/* INLINE, NOT FLEX. As a flex row the mark is its own item, so at 320px it wraps onto a line of
   its own and the reader gets a bicycle floating above the session it belongs to -- a mark paired
   with nothing, which is the one thing the design system says a mark must never be. Inline, it
   flows with the words and breaks only where text breaks. */
.slot .what{margin:0; font-size:.9375rem; min-width:0; overflow-wrap:anywhere}
.slot .kind{color:var(--quieter); font-size:.75rem; display:block}
.slot .leave{color:var(--quiet); font-size:.8125rem; font-variant-numeric:tabular-nums; margin:0}
.slot .where{color:var(--quieter); font-size:.8125rem; overflow-wrap:anywhere; margin:0}

/* The session's own figures. Value and label are two different things and are set apart, because
   "18 km" without "distance" beside it is a number looking for a question. */
.figs{margin:.125rem 0 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.25rem .75rem}
.figs li{font-size:.8125rem}
.figs .v{font-variant-numeric:tabular-nums; font-weight:600}
.figs .l{color:var(--quieter); margin-left:.35em}

/* THE ONE RULE, and it is the reason this screen can replace most of the weekly page. It is the
   decision made BEFORE the session, in the artifact's own words -- "if rep 2 comes in slower than
   5:40/km, rep 3 is run at 6:00/km" -- and it is already in the payload. It gets the hairline the
   hero gives it, because on the day it is the only line that changes what happens. */
.srule{margin:.25rem 0 0 0; padding-top:.375rem; border-top:1px solid var(--hairline);
       font-size:.875rem; line-height:1.45}
.swhy{margin:0; color:var(--quiet); font-size:.8125rem; line-height:1.5}
/* Four states share ONE dim treatment and are told apart by the WORD, which is the only carrier
   that survives a forced-colours mode. `planned` prints nothing: it is the default, and labelling
   it would put a word on every row of a week that is almost entirely planned. */
.slot .status{font-size:.6875rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
              color:var(--quieter); white-space:nowrap; margin-left:.45em}
.slot--closed .what,.slot--closed .t{color:var(--quieter)}
.sport{width:1em; height:1em; display:inline-block; vertical-align:-.125em; margin-right:.35em}
.sport--run{color:var(--sport-run)}
.sport--ride{color:var(--sport-ride)}
/* A closed session's mark and label recede WITH its row. Both the sport tokens and `.kind` set
   `color` outright, so without this the most saturated things on a dim row belong to the session
   that did NOT happen -- emphasis on exactly the wrong line. Below the rules they override. */
.slot--closed .sport,.slot--closed .kind{color:var(--quieter)}

/* The night that closes the day. It is not a session -- it is what the plan asks of the hours
   after the last one -- so it sits below them and is set quieter than they are. `Bed` keeps its
   tracked-out capitals: it is a short word labelling a time INLINE, and without the treatment it
   reads as part of the sentence rather than as the name of the value beside it. */
.bed{margin:.75rem 0 0 0; color:var(--quiet); font-size:.8125rem; line-height:1.5}
.bed .mc{color:var(--quieter); margin-right:.4em}
.bed .plan{font-variant-numeric:tabular-nums; color:var(--text)}

/* A day already spent, collapsed to one line that OPENS. The summary carries the whole target --
   full width and floored at 2.75rem, so it is a row a thumb finds rather than a word to hit. */
.day--past{padding-bottom:0}
.pastline{margin:0 0 1rem 0; color:var(--quieter); font-size:.8125rem}
.pastline .d{font-weight:600}

.day--past summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; gap:.45rem;
  min-height:2.75rem; padding:.25rem 0;
  color:var(--quieter); font-size:.8125rem;
}
/* Safari draws its own triangle from a pseudo-element the standard property does not reach. */
.day--past summary::-webkit-details-marker{display:none}
.day--past summary .d{font-weight:600}
/* THE ROTATION SNAPS, and is not a transition. It is not decoration -- it is the only thing
   distinguishing an open day from a closed one at a glance, and this design system's rule is that
   information must never be carried in motion alone: a still frame has to say what the moving one
   said. Measured in the browser, the eased version was worse than merely redundant, resolving to
   an identity matrix and leaving the arrow pointing right on an OPEN day. An explicit rotate(0)
   base is what gives the open state something definite to be, rather than interpolating from
   `none`. */
.disc{width:.9em; height:.9em; flex:none; transform:rotate(0deg)}
details[open] > summary .disc{transform:rotate(90deg)}
/* Guarded, for the same reason the chips are: a touch browser leaves :hover on the last thing
   tapped, which would mark a closed day as the open one. */
@media (hover: hover){
  .day--past summary:hover{color:var(--accent)}
}
.day--past summary:active{color:var(--accent)}
.day--past summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.day--past details[open]{padding-bottom:1rem}
.day--past details .slots{margin-top:.25rem}
/* The rotation is the only thing saying open from closed for a reader who cannot see the layout
   shift, so under reduced motion it must still ARRIVE -- just without travelling. The global
   reduce block already collapses the duration; this is here to say that is deliberate. */

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
                       transition-duration:.01ms !important; scroll-behavior:auto !important}
}
