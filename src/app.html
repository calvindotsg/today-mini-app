<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<!--
  THE ONE SCREEN, AND THE ONLY DOCUMENT. Served to anyone who asks; it carries the design and the
  renderer and NO TRAINING DATA AT ALL. The week arrives from POST /s, which answers only a launch
  Telegram signed for the one allowed account and returns 401 with an empty body to everyone else.

  IT USED TO BE TWO DOCUMENTS -- a contentless shell that fetched the finished page and replaced
  itself with `document.write` -- so that not even the stylesheet reached a stranger. That is
  IMPOSSIBLE with a CSP nonce and it failed silently: `document.write` does not create a new
  document, so the written markup is judged against the FIRST response's Content-Security-Policy,
  the second response's nonce matches nothing, and every inline <style> and <script> is dropped.
  The result is a blank white page with no error anywhere. Measured on the live site: the two
  responses carried `nonce-kCVb0Cuex5ja4xAcrw7AGQ` and `nonce-iMrWZCXlO8c5cS5ja9WGPQ`.
  Do not split this back into two documents.

  DESIGN: the calvin.sg design system, the same fifteen tokens the weekly artifact is drawn in.
    - NO RAW HEX outside the three palette blocks below. System colours in the forced-colours
      block are not hex and are the one thing a token cannot say.
    - The site defines its tokens ONLY under [data-theme=...]. This page has a THIRD state --
      nothing stamped, which is what a reader who has never chosen a theme is in -- so the
      palette is restated across bare :root, @media (prefers-color-scheme: dark), and
      :root[data-theme=dark]. This is deliberate. Do NOT "fix" it by deleting the bare :root;
      that is the only block that paints for a reader who has never chosen.
    - color-scheme IS PINNED IN BOTH STAMPED STATES, and here that is load-bearing rather than
      defensive. Block 1 declares BOTH schemes, which hands the choice to the OS -- right for
      the un-stamped state, wrong for the two the control at the foot of this page stamps,
      where the page has overruled the OS and the UA has not been told. Unpinned, forcing light
      on a dark phone is a light page with dark scrollbars and dark form controls.
    - THE THIRD STATE IS A STATE THE READER CAN BE IN, so the control offers three and not two.
      A two-state toggle stamps on its first press and can never get back to "follow the
      system" for the life of that browser. The three blocks below already ARE the three
      states: stamp dark, stamp light, or REMOVE the attribute. There is no second palette to
      write and no matchMedia listener to keep, because block 2 is a media query -- an OS that
      changes under an un-stamped page is handled in CSS with no script running at all.
    - THIS PAGE IS THE DONOR. weekly-training-plan's design-system reference sends every plan
      artifact here to lift the palette, because it is the same system already shaped for an
      embedded page. A defect here is copied into next week's artifact.
-->
<style nonce="__NONCE__">
/* ── palette, block 1 of 3: bare :root. Light, and the un-stamped default. ──────────────── */
:root{
  --background:#fafafa; --card-background:#f5f5f5; --card-border:#e5e5e5;
  --shadow:#a82334; --accent:#a82334; --text:#0b0b0b;
  --progress-fill:#a82334; --progress-track:#e3b3b8;
  --status-live:#a82334; --status-halo:#a82334; --brand-ink:#a82334;
  --sport-ride:#a82334; --sport-ride-on-ink:#f3a3aa;
  --sport-run:#1f4e9c;  --sport-run-on-ink:#9fc0f0;
  color-scheme:light dark;
}
/* ── palette, block 2 of 3: the viewer's system preference, with no attribute stamped. ──── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
    --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
    --progress-fill:#f9cdd3; --progress-track:#462f32;
    --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
    --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
    --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  }
}
/* ── palette, block 3 of 3: an explicit choice, which must beat the media query. ────────── */
:root[data-theme=dark]{
  --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
  --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
  --progress-fill:#f9cdd3; --progress-track:#462f32;
  --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
  --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
  --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  color-scheme:dark;
}
/* The light stamp takes color-scheme AND NOTHING ELSE. Its VALUES already resolve correctly --
   block 1 supplies them, and block 2 is suppressed by its own :not([data-theme=light]) guard --
   so a fourth copy of the light token list would be a copy with no runtime reason to exist,
   which is the one thing the design system forbids outright. Specificity needs no reordering:
   this is (0,2,0) and beats block 1's bare :root. */
:root[data-theme=light]{ color-scheme:light; }

/* ── derived, as the site derives them ─────────────────────────────────────────────────── */
:root{
  --hairline:color-mix(in srgb, var(--text) 32%, transparent);
  --quiet:  color-mix(in srgb, var(--text) 62%, transparent);
  --quieter:color-mix(in srgb, var(--text) 42%, transparent);
  --fill:   color-mix(in srgb, var(--text)  6%, transparent);
  --radius-card:.5rem; --plate:2px 2px 0 var(--shadow);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--background); color:var(--text);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  padding:1.25rem 1rem calc(2rem + env(safe-area-inset-bottom)) 1rem;
  /* 320 px is the floor this must work at. Everything below sizes off the viewport, never a
     fixed width, and the one long-word field (place) gets an explicit break. */
  max-width:34rem; margin-inline:auto;
}
.mc{font-size:.625rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}

header{display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:baseline; margin-bottom:1rem}
header .week{color:var(--quiet)}
header .asof{color:var(--quieter); font-size:.75rem; margin-left:auto}

/* The banner is the honesty surface. It appears ONLY when something is actually wrong, so its
   presence is information -- a banner that is always there is furniture. */
.banner{
  border:1px solid var(--accent); border-radius:var(--radius-card);
  background:var(--fill); padding:.75rem .875rem; margin-bottom:1.25rem;
}
.banner .mc{color:var(--accent); display:block; margin-bottom:.25rem}
.banner p{margin:0; font-size:.875rem}

.card{
  border:1px solid var(--card-border); border-radius:var(--radius-card);
  background:var(--card-background); padding:1.125rem 1rem; margin-bottom:1rem;
}
.card--now{box-shadow:var(--plate)}
.kind{color:var(--accent); display:block; margin-bottom:.375rem}
h1{font-size:1.375rem; line-height:1.25; margin:0 0 1rem 0; font-weight:600; letter-spacing:-.01em}

/* THE NUMBER. The one element on this screen that has to be readable at arm's length at 6am,
   which is the whole reason the app exists. It scales with the viewport and is capped so it
   cannot wrap at 320 px. */
.clock{margin:0 0 .875rem 0}
.clock .label{color:var(--quiet); display:block; margin-bottom:.125rem}
.clock time{
  display:block; font-size:clamp(3rem, 17vw, 4.25rem); line-height:1;
  font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
  color:var(--accent);
}
.clock .window{color:var(--quiet); font-size:.8125rem; margin-top:.375rem; display:block}

dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.375rem .75rem; align-items:baseline}
dt{color:var(--quieter); white-space:nowrap}
dd{margin:0; font-size:.9375rem; overflow-wrap:anywhere}

/* The session's figures on the Now card. Same list and same class as a week row -- a figure reads
   the same on both screens -- with the space the card's other secondary blocks get, and one step of
   size back: this card has the room, and the numbers are the prescription rather than a footnote.
   `.figs` itself is declared with the week screen, which is where it is used seven times over. */
.card--now .figs{margin-top:.875rem}
.card--now .figs li{font-size:.875rem}

.rule{border:0; border-top:1px solid var(--hairline); margin:1rem 0}
.onerule{margin:0; font-size:1rem; line-height:1.45}
.bring{margin:.75rem 0 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.375rem}
.bring li{border:1px solid var(--hairline); border-radius:2px; padding:.125rem .5rem; font-size:.8125rem}

.next{display:flex; flex-wrap:wrap; gap:.25rem .625rem; align-items:baseline}
.next .when{color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap}
.next .what{font-size:.9375rem}
.later{color:var(--quieter); font-size:.8125rem; margin:.5rem 0 0 0}

.why{color:var(--quiet); font-size:.875rem; line-height:1.55; margin:0}
.why .mc{display:block; color:var(--quieter); margin-bottom:.25rem}

footer{margin-top:1.5rem; color:var(--quieter); font-size:.6875rem}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
/* THE SCREEN CONTAINER IS NOT A CONTROL. Swapping screens moves focus here so a reader driving the
   page by keyboard or screen reader lands at the top of what just replaced the page, rather than
   wherever the old markup left them -- but `#root` is tabindex="-1", is not in the tab order, and
   is never focused by a person. The ring is a control's affordance, and drawn around the whole
   viewport it reads as an error state. The focus MOVE is the accessible behaviour; the ring is not
   part of it. */
#root:focus,#root:focus-visible{outline:none}

/* ── the theme control ─────────────────────────────────────────────────────────────────────
   THE SITE'S `chip` AND `chip-icon`, WRITTEN OUT. The classes do not travel -- this page loads
   no stylesheet from calvin.sg and never could -- so what transfers is the vocabulary: the
   quiet surface at a hairline of the ink, no plate, 2.75rem on both axes, and the inverted fill
   for the option that is current. The plate is this design's mark for a page's ONE action, and
   setting a preference is furniture, so furniture recedes and the number stays the loudest
   thing on the screen. It sits at the FOOT for the same reason: at 6am the plan is what the
   eye and the keyboard should meet first.

   THREE EXCLUSIVE STATES ARE NOT A TOGGLE BUTTON. The site's control reports a pressed state,
   which is right for two; the WAI-ARIA pattern for a set of three is the radio group. These
   are native radios, so the grouping, the checked state and the arrow-key roving are the
   platform's rather than a re-implementation of them, and the label is the whole target.

   THE MARK SET IS CLOSED. It ships a sun and a moon and nothing that means "follow the
   system", so that option is drawn as a WORD -- never an emoji, never a second icon family. */
.sr-only,.theme input{
  position:absolute; width:1px; height:1px; padding:0; margin:0; overflow:hidden;
  clip-path:inset(50%); white-space:nowrap; border:0;
}
.chrome{margin-top:1.5rem}
.theme{position:relative; display:flex; flex-wrap:wrap; gap:.5rem; border:0; margin:0; padding:0; min-inline-size:0}
/* THE SURFACE IS SHARED; THE STATE MACHINE IS NOT. `.chip` here is the navigation control between
   the two screens, and it wears the same quiet box as a theme option because the site's vocabulary
   says both are the same KIND -- chrome: getting somewhere, and setting a preference.
   What is NOT shared is everything below that depends on `input:checked + label`. A nav chip is a
   <button> with no adjacent radio, so there is no sibling for those selectors to match, and the
   ORDER they sit in relative to the press rule is load-bearing for the theme control alone. Adding
   `.chip` to the base, the hover and the press is the whole of the sharing. */
.theme label,.chip{
  display:inline-flex; align-items:center; justify-content:center; gap:.4em;
  /* 2.75rem on BOTH axes: the enhanced target size, in rem so it grows with the reader's own
     text rather than pinning a box in pixels the text then outgrows. */
  min-height:2.75rem; min-width:2.75rem; padding:.3rem .7rem;
  border:1px solid var(--hairline); border-radius:2px;
  background:var(--background); color:var(--text); cursor:pointer;
  /* A <label> inherits the page's face; a <button> does NOT -- it takes the UA's own control font
     and would arrive a step off the type ramp beside an identical-looking theme chip. */
  font-family:inherit; appearance:none; -webkit-appearance:none;
  font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:color .3s cubic-bezier(.4,0,.2,1), background-color .3s cubic-bezier(.4,0,.2,1),
             border-color .3s cubic-bezier(.4,0,.2,1);
}
/* The glyph box is PINNED where the labelled one is floored: a label comes from the vocabulary
   and must be allowed to grow, a mark is a size the design picked. */
.theme label.glyph{width:2.75rem; height:2.75rem; padding:0}
.theme svg{width:1.25rem; height:1.25rem; display:block; fill:currentColor}
/* Guarded, because a touch browser applies :hover on tap and holds it until something else is
   tapped -- which would leave the last option pressed wearing the accent beside the one that is
   genuinely current, faking the exact distinction this row exists to draw. */
@media (hover: hover){
  .theme label:hover,.chip:hover{border-color:var(--accent); color:var(--accent)}
}
/* The current option, in the site's own inverted treatment. */
.theme input:checked + label{background:var(--text); border-color:var(--text); color:var(--background)}
/* A press shows something on EVERY option including the current one, and it SNAPS: a tap is
   over in about 100ms against a 300ms ramp, so an eased press is drawn about a third of the way
   and then undrawn. Below the checked rule on purpose, so the option you are already on also
   answers the finger. */
.theme label:active,.chip:active{border-color:var(--accent); color:var(--accent); transition:none}
/* ...and the option you are already on keeps its readable ink, because accent on the --text
   flood measures 2.77:1 light and 1.37:1 dark. The accent border still says the tap landed. */
.theme input:checked + label:active{color:var(--background); transition:none}
/* Focus gets its own rule and is never listed with hover: hover is a pointer's affordance and
   some readers have no pointer. The ring goes on the label because the input is the 1px box. */
.theme input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
/* THE SWAP SNAPS, and this is the same rule as the press one above rather than a new idea.
   The 300ms ramp is the chip's hover and press affordance; a THEME change moves every token
   under it at once, so without this the ground flips instantly while the chips ease across for
   a third of a second -- measured in the browser, the chips still resolving the OLD palette's
   #111111 on the NEW palette's #fafafa ground. That is an acknowledgement of the press fading
   in after the press, which is the one thing this design says a press must never do. Set for
   exactly one forced reflow by the script below, so hover and press keep their ramp. */
:root[data-swapping] .theme label,:root[data-swapping] .chip{transition:none}
/* A forced-colours mode replaces every author colour, so the inverted fill -- the only thing
   saying which option is current -- would arrive blank. The marks need nothing: they are inline
   SVG filled with currentColor, not a mask over a background the mode overrides. */
@media (forced-colors: active){
  .theme input:checked + label{
    forced-color-adjust:none; background:Highlight; border-color:CanvasText; color:HighlightText;
  }
}

/* ── the week screen ───────────────────────────────────────────────────────────────────────
   The second screen, and everything below is only ever on it. It is a LIST, where the Now screen
   is a single card: the reader is scanning seven days rather than reading one number, so nothing
   here is allowed to compete with `.clock` for weight -- the two screens share a palette and a
   type ramp, not a hierarchy. */
.nav{margin:1.25rem 0 0 0; display:flex; gap:.5rem}
/* The week screen's own name. It is an `h1` -- one per screen -- so the ramp above already sets
   it; the ONLY thing that differs is the space beneath, because the Kiprun line belongs to this
   heading rather than to the gauge. Restating the ramp here would be a second copy of a size that
   is already decided, and this rule was briefly written as `h2.weekhead`, which matched nothing. */
.weekhead{margin:0 0 .25rem 0}
.race{color:var(--quiet); font-size:.8125rem; margin:0 0 1.25rem 0}

/* THE GAUGE. The design system's rule for a quantity: a flat two-pixel stroke, the marked region
   over the remainder, and the scale named IN WORDS BEFORE the bar -- a length means nothing until
   the reader knows what it is measured against. The number is printed as well as drawn, because a
   bar is a shape and the reader who cannot resolve the shape is the one who most needs the value.
   No ink goes inside the bar: the fill flips polarity between the themes. */
.gauge{margin:0 0 1.5rem 0}
.gauge .scale{display:block; margin-bottom:.5rem; font-size:.9375rem}
.gauge .scale b{font-weight:600; font-variant-numeric:tabular-nums}
.gauge .bar{display:block; height:2px; background:var(--progress-track); overflow:hidden}
.gauge .bar i{display:block; height:2px; background:var(--progress-fill)}
.gauge .step{color:var(--quiet); font-size:.8125rem; margin:.5rem 0 0 0}
/* A quantity nobody published is drawn as an ABSENCE and named, never as a zero-length bar --
   a measured zero and an unmeasured value are different facts and only the undrawn one can say so. */
.gauge .absent{color:var(--quieter); font-size:.8125rem; margin:.5rem 0 0 0}

.day{padding:1rem 0 0 0; border-top:1px solid var(--card-border)}
.day:first-of-type{border-top:0; padding-top:0}
/* TODAY, DRAWN IN FULL ON THE FIRST SCREEN. It is `.day` in every respect but the class, and the
   class is separate for one measured reason: `.day:first-of-type` above strips the rule and the
   space from the first day of the week, and on the Today screen this section IS the first one --
   so sharing the class would silently delete the only thing separating it from the card above it.
   Everything inside it (`.dhead`, `.tag`, `.slots`, `.bed`, `.pastline`) is styled by its own class
   and needs nothing further. */
.dayfull{margin:1.5rem 0 1.25rem 0; padding-top:1.25rem; border-top:1px solid var(--card-border)}
.dhead{display:flex; flex-wrap:wrap; gap:.375rem .625rem; align-items:baseline;
       margin:0 0 .625rem 0; font-size:.9375rem; font-weight:600}
.dhead .d{white-space:nowrap}
/* The day's one-word character, in the same hairline bib the Now card's `bring` list wears. */
.tag{border:1px solid var(--hairline); border-radius:2px; padding:.05rem .4rem;
     font-size:.6875rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
     color:var(--quiet)}
/* Today is marked by a DOT AND A WORD. The dot alone would be information carried in colour, which
   a forced-colours mode replaces, and in a shape a reader may not read as current. */
.dhead .today{color:var(--status-live); display:inline-flex; align-items:center; gap:.3em;
              font-size:.6875rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
.dhead .today::before{content:""; width:.5rem; height:.5rem; border-radius:50%;
                      background:var(--status-live); flex:none}

.slots{margin:0; padding:0; list-style:none; display:grid; gap:.875rem}
.slot{display:grid; grid-template-columns:3.4rem 1fr; gap:.125rem .625rem}
.slot .t{color:var(--accent); font-variant-numeric:tabular-nums; font-size:.875rem; white-space:nowrap}
/* The end time sits UNDER the start rather than beside it, so the column stays narrow enough to
   leave a readable measure for the session at 320px -- which is the width this page is written to. */
.slot .t .to{display:block; color:var(--quieter); font-size:.75rem}
/* An untimed session is a NOTE attached to the day -- a kit list, a fuel plan, a rest by design --
   not an appointment. It keeps the column so the titles stay aligned, and says so rather than
   showing a blank where a clock would be. */
.slot .t--none{color:var(--quieter)}
/* `min-width:0` because a grid item refuses to shrink below its longest word by default, and a
   venue or a session name from upstream is not a string this page gets to choose the length of.
   Same defence `dd` already carries on the Now screen, for the same reason. */
.sbody{min-width:0; display:grid; gap:.25rem; align-content:start}
/* INLINE, NOT FLEX. As a flex row the mark is its own item, so at 320px it wraps onto a line of
   its own and the reader gets a bicycle floating above the session it belongs to -- a mark paired
   with nothing, which is the one thing the design system says a mark must never be. Inline, it
   flows with the words and breaks only where text breaks. */
.slot .what{margin:0; font-size:.9375rem; min-width:0; overflow-wrap:anywhere}
.slot .leave{color:var(--quiet); font-size:.8125rem; font-variant-numeric:tabular-nums; margin:0}
.slot .where{color:var(--quieter); font-size:.8125rem; overflow-wrap:anywhere; margin:0}

/* The session's own figures. Value and label are two different things and are set apart, because
   "18 km" without "distance" beside it is a number looking for a question. */
.figs{margin:.125rem 0 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.25rem .75rem}
.figs li{font-size:.8125rem}
.figs .v{font-variant-numeric:tabular-nums; font-weight:600}
.figs .l{color:var(--quieter); margin-left:.35em}

/* THE ONE RULE, and it is the reason this screen can replace most of the weekly page. It is the
   decision made BEFORE the session, in the artifact's own words -- "if rep 2 comes in slower than
   5:40/km, rep 3 is run at 6:00/km" -- and it is already in the payload. It gets the hairline the
   Now card gives it, because on the day it is the only line that changes what happens. */
.srule{margin:.25rem 0 0 0; padding-top:.375rem; border-top:1px solid var(--hairline);
       font-size:.875rem; line-height:1.45}
.swhy{margin:0; color:var(--quiet); font-size:.8125rem; line-height:1.5}
/* Four states share ONE dim treatment and are told apart by the WORD, which is the only carrier
   that survives a forced-colours mode. `planned` prints nothing: it is the default, and labelling
   it would put a word on every row of a week that is almost entirely planned. */
.slot .status{font-size:.6875rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
              color:var(--quieter); white-space:nowrap; margin-left:.45em}
.slot--closed .what,.slot--closed .t{color:var(--quieter)}
.sport{width:1em; height:1em; display:inline-block; vertical-align:-.125em; margin-right:.35em}
.sport--run{color:var(--sport-run)}
.sport--ride{color:var(--sport-ride)}
/* A closed session's mark and label recede WITH its row. Both the sport tokens and `.kind` set
   `color` outright, so without this the most saturated things on a dim row belong to the session
   that did NOT happen -- emphasis on exactly the wrong line. Below the rules they override. */
.slot--closed .sport,.slot--closed .kind{color:var(--quieter)}

/* The night that closes the day. It is not a session -- it is what the plan asks of the hours
   after the last one -- so it sits below them and is set quieter than they are. */
.bed{margin:.625rem 0 0 0; color:var(--quiet); font-size:.8125rem; line-height:1.5}
.bed .mc{color:var(--quieter); margin-right:.4em}
.bed .plan{font-variant-numeric:tabular-nums; color:var(--text)}

/* A day already spent, collapsed to one line that OPENS. The summary carries the whole target --
   full width and floored at 2.75rem, so it is a row a thumb finds rather than a word to hit. */
.day--past{padding-bottom:0}
.pastline{margin:0 0 1rem 0; color:var(--quieter); font-size:.8125rem}
.pastline .d{font-weight:600}

.day--past summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; gap:.45rem;
  min-height:2.75rem; padding:.25rem 0;
  color:var(--quieter); font-size:.8125rem;
}
/* Safari draws its own triangle from a pseudo-element the standard property does not reach. */
.day--past summary::-webkit-details-marker{display:none}
.day--past summary .d{font-weight:600}
/* THE ROTATION SNAPS, and is not a transition. It is not decoration -- it is the only thing
   distinguishing an open day from a closed one at a glance, and this design system's rule is that
   information must never be carried in motion alone: a still frame has to say what the moving one
   said. Measured in the browser, the eased version was worse than merely redundant, resolving to
   an identity matrix and leaving the arrow pointing right on an OPEN day. An explicit rotate(0)
   base is what gives the open state something definite to be, rather than interpolating from
   `none`. */
.disc{width:.9em; height:.9em; flex:none; transform:rotate(0deg)}

<script nonce="__NONCE__">

  // reader sets independently of the OS. That was survivable while this page only ever followed
  // prefers-color-scheme -- the two disagreed no more often than the OS and Telegram did. It is
  // NOT survivable now: the control above lets him choose light while Telegram is dark, and the
  // page then sits light under a dark header with dark ground below it.
  //
  // Telegram's own guidance is to "deliver a seamless experience by monitoring the dynamic
  // theme-based colors provided by the API and using them accordingly". For a page that carries
  // its own design system the compliant direction is OUTWARD: tell Telegram what this page is
  // painted, rather than repainting this page in Telegram's colours -- which would put fifteen
  // tokens' worth of decided design at the mercy of whatever custom theme he is running.
  //
  // The value is READ OUT OF THE TOKEN, never written here: --background is the one thing that
  // already says what the resolved ground is in all three states, and a literal would be a hex
  // outside the palette blocks and wrong in two states out of three.

    // header where it already was. The alternative, color_key:"bg_color", is worse than nothing
    // here -- it paints the header from TELEGRAM's palette, which is the disagreement itself.

  // loaded: it is an external request this page is not allowed to make, and the two events it
  // would send for us are one postMessage each. If the bridge is missing the app still renders --
  // it just opens at the default half height. Cosmetic paths fail open.

  var root = document.getElementById("root");

  // be on Bot API 6.1+ for the back button to exist at all, and there has to be a bridge to ask.
  // Assigned once at boot, from the launch parameters. When it is false the week screen draws its
  // own `Today` chip instead -- so the fallback is conditional rather than a permanent duplicate
  // of a control the header already offers.

  function setBackButton(visible) {
    if (!backSupported) return;
    postEvent("web_app_setup_back_button", { is_visible: !!visible });
  }

  // Telegram puts the launch parameters in the URL FRAGMENT, which is never sent to a server --
  // so nothing can be proven about the first GET, and this is the request that proves it. The
  // query string is checked too because a direct link can deliver them there on some clients.
  // ALSO READS THE VERSION, which is the one fact that decides whether this page draws its own
  // way back. Telegram puts `tgWebAppVersion` in the same fragment as the credential, so the
  // client's Bot API level is already in hand and costs no round trip and no feature-detection
  // guess -- and the back button it gates on needs 6.1.
  //
  // ALSO READS THE START PARAMETER, which is how a `?startapp=` deep link says which screen to
  // open on. Telegram delivers it as `tgWebAppStartParam` in the SAME fragment as the credential
  // -- so, like the version, it is already in hand. `start_param` inside the signed initData
  // carries the same value, but reading it from THERE would mean the screen could not be chosen
  // until after the server had answered; this is available before the first paint.
  //
  // !! IT IS NOT A CREDENTIAL AND IS NOT TREATED AS ONE. It comes from an unsigned part of the
  // URL, so anyone who can open the page can set it. That is harmless HERE and only here: it
  // picks between two screens that render the SAME already-authorised week, issues no fetch of
  // its own, and reaches no field the reader could not see by tapping. `screenFor` is what keeps
  // it that way -- it maps to a closed set rather than trusting the string.

    var out = { data: "", version: "", startParam: "" };
    // !! THE START PARAMETER IS COLLECTED FROM ANY SOURCE, INDEPENDENTLY OF THE CREDENTIAL, and
    // that is the bug this shape replaces. The old loop returned on the FIRST source carrying
    // `tgWebAppData` and read the start parameter out of that same source -- so a launch that
    // put the credential in one place and `tgWebAppStartParam` in the other silently opened on

    // structurally incapable of finding it: a corpus that only contains the easy case describes

  }

  // transports have different shapes. Still no telegram-web-app.js: this is the whole of what it
  // would have been loaded for.

  }

  // Windows Phone. telegram-web-app.js installs all three, and anything standing in for it must too.

  // iOS/Android name and guarded it with `if (!alreadyThere)`. The back arrow APPEARED -- so the
  // outbound half was correct -- and pressing it did nothing at all, because the client had already
  // placed its own object at that path and the guard then skipped the assignment entirely. A guard
  // written to avoid clobbering someone else's handler instead silently dropped our own.
  //

    // A spoofed event could only flip a client-side screen: it issues no fetch and exposes no
    // data. The check is here because it is two lines, not because the impact is large.

  function renderHeader() {
    var h = el("header");
    if (view.weekLabel) add(h, el("span", "week mc", view.weekLabel));
    if (view.generatedAt) {

    // paired with the title rather than standing alone, which is the design system's whole rule
    // for a mark -- and `sportMark` carries its own visually-hidden word, so nothing here depends
    // on colour or on the icon rendering at all.
    var h = el("h1");

    // and when there is neither, show no clock at all rather than an empty one.
    //

    // passed, set in the largest type on the screen -- the one element this design cannot afford
    // to get wrong. What is still ahead of him by then is the END, so that becomes the number
    // wherever the artifact states one. Where it does not, the start is shown and LABELLED as
    // having happened: the app never paints its own 90-minute guess as a clock.
    var iso = s.leaveBy, label = "Leave by";
    if (!iso) { iso = s.at; label = "Starts"; }
    if (view.inProgress) {
      iso = s.until; label = "Until";
      if (!iso) { iso = s.at; label = "Started"; }
    }
    var big = hhmm(iso);
    if (big) {
      var clock = el("p", "clock");
      add(clock, el("span", "label mc", label));
      var time = el("time", null, big);
      time.setAttribute("datetime", iso);
      add(clock, time);

      var from = hhmm(s.at), to = hhmm(s.until);
      if (from) window_ += " · " + from + (to ? "–" + to : "");
      add(clock, el("span", "window", window_));
      add(c, clock);
    }

    var dl = el("dl");
    var any = false;
    if (s.place)  { add(dl, el("dt", "mc", "Where")); add(dl, el("dd", null, s.place));  any = true; }
    if (s.travel) { add(dl, el("dt", "mc", "Travel")); add(dl, el("dd", null, s.travel)); any = true; }
    if (any) add(c, dl);

    // THE SESSION'S OWN FIGURES, which this card went without for its whole life while the week
    // screen two taps away printed them. They are the PRESCRIPTION -- "24.0-25.5 kg, military
    // press, 80-85% of 5RM", "6:06/km, aim at this" -- so the one screen he reads at 06:15 was the
    // one screen that did not carry the numbers he is about to lift or run to. Same markup and same
    // class as the week's rows: a figure is a figure on both screens.
    add(c, figures(s.numbers));

    if (s.oneRule) {
      add(c, el("hr", "rule"));
      add(c, el("p", "onerule", s.oneRule));
    }
    if (Array.isArray(s.bring) && s.bring.length) {
      var ul = el("ul", "bring");
      ul.setAttribute("aria-label", "Bring");
      for (var i = 0; i < s.bring.length; i++) add(ul, el("li", null, s.bring[i]));
      add(c, ul);
    }

  }

  // the Now card, so the second thing in the window is almost always a row that list already
  // carries -- and repeating it under the list is the one duplication a screen this short cannot
  // afford. What the list genuinely cannot show is tomorrow and the day after, so that is what this
  // card is: one line of it, plus the count of the rest.
  function renderAfterToday(a) {
    var s = a.next;
    var c = el("div", "card");
    add(c, el("span", "kind mc", "After today"));
    var row = el("p", "next");
    var when = dayLabel(s);
    var t = hhmm(s.at);
    if (t) when += " · " + t;
    add(row, el("span", "when", when));
    var what = el("span", "what");
    if (s.sport === "run" || s.sport === "ride") what.appendChild(sportMark(s.sport));
    what.appendChild(document.createTextNode(s.title));
    add(row, what);
    add(c, row);

    if (a.more > 0) {

    // week is fresh and useless; a plan for this week pushed four days ago is old and correct.
    if (!view.coversToday) {
      add(root, banner("Not this week", "The published plan runs " + view.weekStart + " to " + view.weekEnd +

        "anything shown would be a guess."));

      add(root, banner("Possibly out of date", age === null
        ? "This plan does not say when it was published, so how current it is cannot be established."
        : "This plan was last published about " + age + " hours ago. It may not reflect a change made since."));

        why.appendChild(document.createTextNode(view.now.intention));
        add(root, why);
      }

      add(root, banner(
        view.emptyReason === "empty" ? "Nothing published" : "Nothing left",
        view.emptyReason === "empty"
          ? "The published plan contains no days at all."
          : "Nothing is still to come in the next three days. Everything in that window is done, missed, or a rest by design."));
    }

    // is one session, and everything the reader could not see without opening the week -- the day's
    // character, the sessions that are done or declined, the figures, tonight's bedtime -- was one
    // tap away on a screen he does not open at 06:15.
    var d = todayDay();
    if (d) {
      var full = renderTodayInFull(d, view.now && view.now.date === view.today ? view.now.key : null);
      if (full) add(root, full);
    }

    if (view.afterToday.next) add(root, renderAfterToday(view.afterToday));

    // The way in to the second screen. A CHIP and not a plated control: the design system spends
    // the offset plate on a page's ONE action, and getting somewhere is chrome. It sits after the
    // plan for the same reason the theme control sits at the foot -- at 6am the number is what the
    // eye and the keyboard should meet first.
    if (hasWeek()) {
      var nav = el("div", "nav");
      add(nav, navChip("The week", function () { show("week"); }));
      add(root, nav);
    }

    var f = el("footer", null, view.plannedKm
      ? view.weekLabel + " · " + view.plannedKm + " km planned" + (view.ceilingKm ? " of a " + view.ceilingKm + " km ceiling" : "")
      : view.weekLabel);
    add(root, f);
  }

  // ── the week screen ───────────────────────────────────────────────────────────────────────

  function hasWeek() {
    return Boolean(view && view.ok && view.week && view.week.days && view.week.days.length);
  }

  function navChip(label, onClick) {
    var b = el("button", "chip", label);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  /** One decimal, and no trailing ".0" -- 44.23 is 44.2 km and 18 is 18 km, never 18.0. */
  function fmtKm(n) {
    return String(Math.round(n * 10) / 10);
  }

  // Two of the twenty marks calvin.sg ships, copied from the same Remix Icon set at the same
  // 24x24 grid as the sun and moon above. The set is CLOSED: anything not in it is drawn as a
  // word, never as an emoji and never from a second icon family.
  var SPORT_PATHS = {
    run: "M9.83 8.79L8 9.456V13H6V8.05h.015l5.268-1.918c.244-.093.51-.14.782-.131a2.62 2.62 0 0 1 2.427 1.82q.279.875.51 1.181A5 5 0 0 0 19 11v2a6.99 6.99 0 0 1-5.402-2.547l-.697 3.956L15 16.17V23h-2v-5.898l-2.27-1.904l-.727 4.127l-6.894-1.215l.348-1.97l4.924.868zM13.5 5.5a2 2 0 1 1 0-4a2 2 0 0 1 0 4",
    ride: "M5.5 21a4.5 4.5 0 1 1 0-9a4.5 4.5 0 0 1 0 9m0-2a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m13 2a4.5 4.5 0 1 1 0-9a4.5 4.5 0 0 1 0 9m0-2a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m-7.477-8.695L13 12v6h-2v-5l-2.719-2.266A2 2 0 0 1 8 7.671l2.828-2.828a2 2 0 0 1 2.829 0l1.414 1.414a6.97 6.97 0 0 0 3.917 1.975l-.01 2.015a8.96 8.96 0 0 1-5.321-2.575zM16 5a2 2 0 1 1 0-4a2 2 0 0 1 0 4",
  };

  function sportMark(sport) {
    var NS = "http://www.w3.org/2000/svg";
    var frag = document.createDocumentFragment();
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "sport sport--" + sport);
    svg.setAttribute("viewBox", "0 0 24 24");
    // Hidden from the tree with the word beside it, which is this page's existing idiom for a
    // mark -- the same shape the theme control's sun and moon already use.
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "currentColor");
    path.setAttribute("d", SPORT_PATHS[sport]);
    svg.appendChild(path);
    frag.appendChild(svg);
    frag.appendChild(el("span", "sr-only", sport === "run" ? "Run" : "Ride"));
    return frag;
  }

  // THE DISCLOSURE MARK, and it is not a new icon. The calvin.sg mark set is closed and ships no
  // chevron, so a spent day opens on the set's OWN right arrow, turned 90 degrees by CSS when the
  // day is open. Same mark, oriented -- rather than an emoji or a second icon family, both of which
  // the design system refuses outright.
  var ARROW_RIGHT = "m16.172 11l-5.364-5.364l1.414-1.414L20 12l-7.778 7.778l-1.414-1.414L16.172 13H4v-2z";

  function discMark() {
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "disc");
    svg.setAttribute("viewBox", "0 0 24 24");
    // The summary's own text says which day it is; the arrow only says "this opens", which the
    // element already tells the accessibility tree.
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "currentColor");
    path.setAttribute("d", ARROW_RIGHT);
    svg.appendChild(path);
    return svg;
  }

  function renderGauge(v) {
    var g = el("div", "gauge");
    var scale = el("p", "scale");

    if (typeof v.plannedKm !== "number") {
      add(scale, document.createTextNode("This plan does not state a distance for the week."));
      add(g, scale);
      return g;
    }

    // THE SCALE IS NAMED IN WORDS BEFORE THE BAR. A length means nothing until the reader knows
    // what it is measured against, and a target and a set's largest member are two different
    // pictures drawn identically.
    add(scale, el("b", null, fmtKm(v.plannedKm) + " km"));
    if (typeof v.fraction !== "number") {
      // Drawn as an ABSENCE and named. A ceiling nobody published and a week at 0% of its ceiling
      // are different facts, and only the undrawn bar can tell them apart.
      scale.appendChild(document.createTextNode(" planned."));
      add(g, scale);
      add(g, el("p", "absent", "No ceiling is published for this week, so there is nothing to measure it against."));
      return g;
    }
    scale.appendChild(document.createTextNode(" planned, of a "));
    add(scale, el("b", null, fmtKm(v.ceilingKm) + " km"));
    scale.appendChild(document.createTextNode(" ceiling."));
    add(g, scale);

    var bar = el("span", "bar");
    var fill = el("i");
    // CSSOM, not a style attribute: the CSP carries a nonce and no 'unsafe-inline', which forbids
    // a parsed style="" but does not reach a property set through the object model.
    fill.style.width = Math.max(0, Math.min(1, v.fraction)) * 100 + "%";
    add(bar, fill);
    add(g, bar);

    // The number is printed as well as drawn. A bar is a shape, and the reader who cannot resolve
    // the shape is the reader who most needs the value.
    var pct = Math.round(v.fraction * 1000) / 10;
    var step = el("p", "step");
    step.appendChild(document.createTextNode(
      pct + "% of the ceiling" + (v.fraction > 1 ? " — over it." : ".")));
    if (typeof v.stepPct === "number") {
      var d = Math.round(v.stepPct * 10) / 10;
      step.appendChild(document.createTextNode(
        " " + (d >= 0 ? "Up " : "Down ") + Math.abs(d) + "% on last week's " + fmtKm(v.priorWeekKm) + " km."));
    }
    add(g, step);
    return g;
  }

  /**
   * @param s        a session from the week
   * @param reveal   show a CLOSED session's detail too. False on the days ahead, where a skipped
   *                 session's rule and figures are noise; true inside an opened past day, where
   *                 the reader has explicitly asked what happened.
   */
  function renderSlot(s, reveal) {
    // `statusWord` is null for a planned session and a word for every other state. It decides both
    // the dim treatment and what is printed, so the two can never disagree.
    var closed = Boolean(s.statusWord);
    var li = el("li", "slot" + (closed ? " slot--closed" : ""));

    var t = hhmm(s.at);
    var col = el("span", t ? "t" : "t t--none", t || "—");
    var to = hhmm(s.until);
    if (t && to) add(col, el("span", "to", "–" + to));
    add(li, col);

    var body = el("div", "sbody");

    // `kind` IS SHOWN ONLY WHERE THERE IS NO CLOCK, and that is a deliberate exception to carrying
    // everything. It reads "Run · 19:00" on a session whose `at` is 19:24 -- the artifact's label
    // quotes the CALL time and the payload states the gun -- so printing both puts two disagreeing
    // clocks on one row. CONTRACT.md says outright that `kind` is not a time and must not be parsed
    // for one, so stripping the clock out of it is not available either. Where the session has no
    // `at` at all, `kind` is the only thing describing it ("Ride · evening", "Rest · by design")
    // and it is shown in full.
    if (!t && s.kind) add(body, el("span", "kind mc", s.kind));

    var what = el("p", "what");
    if (s.sport === "run" || s.sport === "ride") what.appendChild(sportMark(s.sport));
    add(what, el("span", null, s.title));
    if (s.statusWord) add(what, el("span", "status", s.statusWord));
    add(body, what);

    // A CLOSED SESSION STOPS HERE ON THE DAYS AHEAD. Everything below is what to DO about a
    // session, and one already done or deliberately skipped is not one there is anything to do
    // about. Inside an opened past day it is shown anyway: there the question is not "what do I do"
    // but "what was this", and that is the question the reader just tapped to ask.
    if (!closed || reveal) {
      // `leaveBy` is the exception and stays hidden on a closed session even when revealed --
      // "leave by 04:55" under something that already happened is a number that has passed, which
      // is the one thing this app's largest element exists never to be.
      if (!closed) {
        var leave = hhmm(s.leaveBy);
        if (leave) add(body, el("p", "leave", "Leave by " + leave));
      }
      if (s.place) add(body, el("p", "where", s.place));
      if (s.travel) add(body, el("p", "where", s.travel));

      body.appendChild(figures(s.numbers));

      if (s.oneRule) add(body, el("p", "srule", s.oneRule));
      if (s.intention) add(body, el("p", "swhy", s.intention));

      if (Array.isArray(s.bring) && s.bring.length) {
        var ul = el("ul", "bring");
        ul.setAttribute("aria-label", "Bring");
        for (var j = 0; j < s.bring.length; j++) add(ul, el("li", null, s.bring[j]));
        add(body, ul);
      }
    }

    add(li, body);
    return li;
  }

  function renderBed(bed) {
    var p = el("p", "bed");
    add(p, el("span", "mc", "Bed"));
    if (bed.plan) add(p, el("span", "plan", bed.plan));
    if (bed.kind) p.appendChild(document.createTextNode(" · " + bed.kind));
    if (bed.text) p.appendChild(document.createTextNode(" " + bed.text));
    return p;
  }

  function renderDay(d) {
    var cls = "day";
    if (d.phase === "past") cls += " day--past";
    if (d.phase === "today") cls += " day--today";
    var sec = el("section", cls);
    if (d.phase === "today") sec.setAttribute("aria-current", "date");

    // A day already spent, collapsed to one line THAT OPENS. The summary is what a spent day
    // usually needs; the detail is there for the day you want to check. `<details>` rather than a
    // scripted toggle, so the disclosure, the keyboard handling and the semantics are the
    // platform's -- which is also what makes it work with no JS state to keep in step.
    if (d.phase === "past") {
      var bits = [];
      if (d.tag) bits.push(d.tag);
      var c = d.counts || { total: 0 };
      if (c.total === 0) {
        bits.push("nothing planned");
      } else {
        // EVERY OUTCOME, or the line lies by omission. Reporting only what was done makes a day of
        // one done and two missed read as a light day rather than a bad one.
        if (c.done) bits.push(c.done + " done");
        if (c.missed) bits.push(c.missed + " missed");
        if (c.skipped) bits.push(c.skipped + " skipped");
        if (c.other) bits.push(c.other + " unrecorded");
      }
      var line = " · " + bits.join(" · ");

      // A day with nothing under it is NOT a disclosure. A control that opens onto emptiness lies
      // about having something behind it, and a rest day is the commonest day of the week.
      if (d.sessions.length === 0 && !d.bed) {
        var p = el("p", "pastline");
        add(p, el("span", "d", dayLabel(d)));
        p.appendChild(document.createTextNode(line));
        add(sec, p);
        return sec;
      }

      var det = el("details");
      var sum = el("summary");
      sum.appendChild(discMark());
      add(sum, el("span", "d", dayLabel(d)));
      sum.appendChild(document.createTextNode(line));
      add(det, sum);

      if (d.sessions.length) {
        var pul = el("ul", "slots");
        // `true` -- inside an opened past day a closed session shows what it WAS, because that is
        // the question the reader just tapped to ask.
        for (var k = 0; k < d.sessions.length; k++) add(pul, renderSlot(d.sessions[k], true));
        add(det, pul);
      }
      if (d.bed) add(det, renderBed(d.bed));
      add(sec, det);
      return sec;
    }

    var h = el("h2", "dhead");
    add(h, el("span", "d", dayLabel(d)));
    if (d.tag) add(h, el("span", "tag", d.tag));
    if (d.phase === "today") add(h, el("span", "today", "Today"));
    add(sec, h);

    if (d.sessions.length) {
      var ul = el("ul", "slots");
      for (var i = 0; i < d.sessions.length; i++) add(ul, renderSlot(d.sessions[i]));
      add(sec, ul);
    } else {
      add(sec, el("p", "pastline", "Nothing planned."));
    }
    if (d.bed) add(sec, renderBed(d.bed));
    return sec;
  }

  // ── today, in full, on the FIRST screen ───────────────────────────────────────────────────
  //
  // These two belong to the Today screen and live here anyway, next to `renderDay`, because the
  // thing they have to keep is a likeness to it. The Today screen used to carry one session in
  // detail and a one-line preview of the next; the same day drawn on the week screen carried the
  // day's tag, EVERY session with its status, its figures and its rule, and the bedtime that closes
  // the day. Two screens disagreeing about the same day is a defect, and the reader met the poorer
  // one first.
  //
  // THE PARITY IS STRUCTURAL, NOT A PROMISE. This calls `renderSlot` and `renderBed` -- the same
  // functions, with the same `reveal` argument `renderDay` passes for a day that is not past -- so
  // a field added to a week row appears here with no second edit. Nothing in the suite renders the
  // DOM, so a copy of that markup could drift with every test still green; sharing the function is
  // what makes drift impossible rather than merely unlikely.
  //
  // ONE FIELD IS MISSING FROM BOTH AND MUST STAY MISSING: `note`. The artifact prints it inside
  // its own day card, and it is where the corrections live and where two of the live week's six
  // notes carry literal <b> tags. `reduce.js` refuses it and `publish.mjs` enforces the refusal.
  function todayDay() {
    if (!view.week || !view.week.days) return null;
    for (var i = 0; i < view.week.days.length; i++) {
      if (view.week.days[i].phase === "today") return view.week.days[i];
    }
    return null;
  }

  /**
   * @param d        today, out of the week
   * @param heroKey  the key of the session already drawn as the Now card, or null when the Now card
   *                 is showing a LATER day -- which is the case on a day whose plan is spent, and
   *                 there this block is the only account of what happened.
   */
  function renderTodayInFull(d, heroKey) {
    var others = [];
    for (var i = 0; i < d.sessions.length; i++) {
      if (d.sessions[i].key !== heroKey) others.push(d.sessions[i]);
    }
    // Nothing to say, and no head to say it under. A day with a tag or a bedtime still has
    // something the Now card cannot carry, so those alone are enough to draw the block.
    if (!others.length && !d.bed && !d.tag) return null;

    var sec = el("section", "dayfull");
    sec.setAttribute("aria-current", "date");
    // The day's own head, exactly as the week draws it -- MINUS the "Today" dot and word, which is
    // the one thing that would be furniture here: this whole screen is today.
    var h = el("h2", "dhead");
    add(h, el("span", "d", dayLabel(d)));
    if (d.tag) add(h, el("span", "tag", d.tag));
    add(sec, h);

    if (others.length) {
      var ul = el("ul", "slots");
      // No `reveal`, which is what `renderDay` passes for a day that is not behind him: a closed
      // session's rule and figures are what to DO about it, and there is nothing to do about one
      // already done or declined. The status word still prints, so the row says what it was.
      for (var j = 0; j < others.length; j++) add(ul, renderSlot(others[j]));
      add(sec, ul);
    } else {
      add(sec, el("p", "pastline", heroKey ? "Nothing else today." : "Nothing planned today."));
    }
    if (d.bed) add(sec, renderBed(d.bed));
    return sec;
  }

  function renderWeek() {
    var w = view.week;
    var h = el("header");
    if (view.weekLabel) add(h, el("span", "week mc", view.weekLabel));
    add(root, h);

    // THE WAY BACK, ALWAYS DRAWN AND AT THE TOP. This was version-gated -- shown only where
    // Telegram could not draw its own arrow -- on the reasoning that two controls for one action
    // is furniture. Measured on a phone, that reasoning cost the whole feature: the arrow rendered
    // and did nothing, and there was no other way off this screen. A way back is not furniture, and
    // it does not get to depend on a bridge. Telegram's arrow is still set up and still works; this
    // is simply not conditional on it.
    var back = el("div", "nav nav--back");
    add(back, navChip("Today", function () { show("today"); }));
    add(root, back);

    // The control that opened this screen says "The week" and so does its heading. Two strings
    // that have to agree are one string.
    add(root, el("h1", "weekhead", "The week"));
    if (typeof w.daysToKiprun === "number" && w.daysToKiprun >= 0) {
      add(root, el("p", "race", w.daysToKiprun === 0
        ? "Kiprun is today."
        : w.daysToKiprun === 1 ? "Kiprun is tomorrow." : "Kiprun in " + w.daysToKiprun + " days."));
    }

    add(root, renderGauge(w.volume || {}));
    for (var i = 0; i < w.days.length; i++) add(root, renderDay(w.days[i]));

    // And again at the foot, because the week is long and scrolling back to the top to leave is a
    // tax on the reader who read all of it.
    var foot = el("div", "nav");
    add(foot, navChip("Today", function () { show("today"); }));
    add(root, foot);
  }

  // ── the two screens ───────────────────────────────────────────────────────────────────────

  var screen = "today";

  function paint() {
    root.textContent = "";
    if (!view.ok) {
      add(root, banner("Cannot show the plan", view.error || "Something is wrong with the published plan."));
      return;
    }
    if (screen === "week") renderWeek(); else renderToday();
  }

  function show(next) {
    screen = next;
    // The screen's name goes on the LANDMARK rather than into a visible eyebrow. It gives the
    // region the name the accessibility guidance asks for, at both ends of the navigation, without
    // adding a word above the one number this design exists to keep loudest.
    root.setAttribute("aria-label", next === "week" ? "The week" : "Today");
    setBackButton(next === "week");
    paint();
    // A swapped screen starts at its own top. Without this, returning from the foot of a scrolled
    // week lands the reader partway down a layout that is no longer there.
    window.scrollTo(0, 0);
    root.focus();
  }

  // The screen a launch opens on, which is `today` unless a deep link said otherwise.
  //
  // !! THE DEEP LINK IS HONOURED ONLY WHEN THERE IS A WEEK TO SHOW. This is also the error path,
  // and an error state has exactly one screen -- opening a refusal with the back arrow lit and an
  // aria-label reading "The week" would describe a screen that is not on the page.
  // Which screen a deep link asked for. TWO SOURCES, and the SIGNED one wins.
  //
  // !! The URL copy was the only source until a real launch opened on `today` with `?startapp=week`
  // tapped. `start_param` inside the verified initData carries the same value and is the copy the
  // bot token vouches for; the page reads it here rather than pre-paint because `screen` was never
  // decided before the server answered anyway -- the old comment claiming a pre-paint advantage
  // described a benefit the code did not take.
  function startParamOf(v) {
    if (v && v.ok && v.startParam) return v.startParam;
    return (launch && launch.startParam) || "";
  }

  function render(v) {
    view = v;
    screen = v && v.ok ? screenFor(startParamOf(v)) : "today";
    root.setAttribute("aria-label", screen === "week" ? "The week" : "Today");
    setBackButton(screen === "week");
    paint();
  }

  // Tell Telegram we are up before the network call, so the client stops showing its own
  // placeholder while we wait.
  postEvent("web_app_ready");
  postEvent("web_app_expand");
  // After ready, deliberately: the client sets up its own chrome on that event, so colours sent
  // before it are the ones it overwrites.
  syncChrome();

  // The three messages below are chosen from what the CLIENT already knows -- whether it had
  // launch parameters, whether the server said no, whether the network answered at all. They tell
  // a stranger nothing: the server's reply is one 401 with an empty body in every refusal.
  var launch = launchParams();
  backSupported = atLeast(launch.version, 6, 1) && hasBridge();
  // Telegram's arrow is a header control, so the page has to say what it does with it.
  onBackPressed = function () { if (screen === "week") show("today"); };

  if (!launch.data) {
    render({ ok: false, error: "Open this from your chat with Mochi." });
    return;
  }
  fetch("/s", {
    method: "POST",
    body: launch.data,
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    cache: "no-store",
    credentials: "omit",
  }).then(function (r) {
    if (!r.ok) { render({ ok: false, error: "This app is not available for your account." }); return null; }
    return r.json();
  }).then(function (v) {
    if (v) render(v);
  }).catch(function () {
    render({ ok: false, error: "Could not reach the plan. Try again in a moment." });
  });
})();
</script>
</body>
</html>
