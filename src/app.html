<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<!--
  THE ONE SCREEN, AND THE ONLY DOCUMENT. Served to anyone who asks; it carries the design and the
  renderer and NO TRAINING DATA AT ALL. The week arrives from POST /s, which answers only a launch
  Telegram signed for the one allowed account and returns 401 with an empty body to everyone else.

  IT USED TO BE TWO DOCUMENTS -- a contentless shell that fetched the finished page and replaced
  itself with `document.write` -- so that not even the stylesheet reached a stranger. That is
  IMPOSSIBLE with a CSP nonce and it failed silently: `document.write` does not create a new
  document, so the written markup is judged against the FIRST response's Content-Security-Policy,
  the second response's nonce matches nothing, and every inline <style> and <script> is dropped.
  The result is a blank white page with no error anywhere. Measured on the live site: the two
  responses carried `nonce-kCVb0Cuex5ja4xAcrw7AGQ` and `nonce-iMrWZCXlO8c5cS5ja9WGPQ`.
  Do not split this back into two documents.

  DESIGN: the calvin.sg design system, the same fifteen tokens the weekly artifact is drawn in.
    - NO RAW HEX outside the three palette blocks below. System colours in the forced-colours
      block are not hex and are the one thing a token cannot say.
    - The site defines its tokens ONLY under [data-theme=...]. This page has a THIRD state --
      nothing stamped, which is what a reader who has never chosen a theme is in -- so the
      palette is restated across bare :root, @media (prefers-color-scheme: dark), and
      :root[data-theme=dark]. This is deliberate. Do NOT "fix" it by deleting the bare :root;
      that is the only block that paints for a reader who has never chosen.
    - color-scheme IS PINNED IN BOTH STAMPED STATES, and here that is load-bearing rather than
      defensive. Block 1 declares BOTH schemes, which hands the choice to the OS -- right for
      the un-stamped state, wrong for the two the control at the foot of this page stamps,
      where the page has overruled the OS and the UA has not been told. Unpinned, forcing light
      on a dark phone is a light page with dark scrollbars and dark form controls.
    - THE THIRD STATE IS A STATE THE READER CAN BE IN, so the control offers three and not two.
      A two-state toggle stamps on its first press and can never get back to "follow the
      system" for the life of that browser. The three blocks below already ARE the three
      states: stamp dark, stamp light, or REMOVE the attribute. There is no second palette to
      write and no matchMedia listener to keep, because block 2 is a media query -- an OS that
      changes under an un-stamped page is handled in CSS with no script running at all.
    - THIS PAGE IS THE DONOR. weekly-training-plan's design-system reference sends every plan
      artifact here to lift the palette, because it is the same system already shaped for an
      embedded page. A defect here is copied into next week's artifact.
-->
<style nonce="__NONCE__">
/* ── palette, block 1 of 3: bare :root. Light, and the un-stamped default. ──────────────── */
:root{
  --background:#fafafa; --card-background:#f5f5f5; --card-border:#e5e5e5;
  --shadow:#a82334; --accent:#a82334; --text:#0b0b0b;
  --progress-fill:#a82334; --progress-track:#e3b3b8;
  --status-live:#a82334; --status-halo:#a82334; --brand-ink:#a82334;
  --sport-ride:#a82334; --sport-ride-on-ink:#f3a3aa;
  --sport-run:#1f4e9c;  --sport-run-on-ink:#9fc0f0;
  color-scheme:light dark;
}
/* ── palette, block 2 of 3: the viewer's system preference, with no attribute stamped. ──── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
    --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
    --progress-fill:#f9cdd3; --progress-track:#462f32;
    --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
    --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
    --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  }
}
/* ── palette, block 3 of 3: an explicit choice, which must beat the media query. ────────── */
:root[data-theme=dark]{
  --background:#111111; --card-background:#171717; --card-border:#2c2c2c;
  --shadow:#f3a3aa; --accent:#f9cdd3; --text:#fafafa;
  --progress-fill:#f9cdd3; --progress-track:#462f32;
  --status-live:#f3a3aa; --status-halo:#f9cdd3; --brand-ink:#f3a3aa;
  --sport-ride:#f3a3aa; --sport-ride-on-ink:#a82334;
  --sport-run:#9fc0f0;  --sport-run-on-ink:#1f4e9c;
  color-scheme:dark;
}
/* The light stamp takes color-scheme AND NOTHING ELSE. Its VALUES already resolve correctly --
   block 1 supplies them, and block 2 is suppressed by its own :not([data-theme=light]) guard --
   so a fourth copy of the light token list would be a copy with no runtime reason to exist,
   which is the one thing the design system forbids outright. Specificity needs no reordering:
   this is (0,2,0) and beats block 1's bare :root. */
:root[data-theme=light]{ color-scheme:light; }

/* ── derived, as the site derives them ─────────────────────────────────────────────────── */
:root{
  --hairline:color-mix(in srgb, var(--text) 32%, transparent);
  --quiet:  color-mix(in srgb, var(--text) 62%, transparent);
  --quieter:color-mix(in srgb, var(--text) 42%, transparent);
  --fill:   color-mix(in srgb, var(--text)  6%, transparent);
  --radius-card:.5rem; --plate:2px 2px 0 var(--shadow);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--background); color:var(--text);
  font-family:var(--sans); font-size:1rem; line-height:1.5;
  padding:1.25rem 1rem calc(2rem + env(safe-area-inset-bottom)) 1rem;
  /* 320 px is the floor this must work at. Everything below sizes off the viewport, never a
     fixed width, and the one long-word field (place) gets an explicit break. */
  max-width:34rem; margin-inline:auto;
}
.mc{font-size:.625rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}

header{display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:baseline; margin-bottom:1rem}
header .week{color:var(--quiet)}
header .asof{color:var(--quieter); font-size:.75rem; margin-left:auto}

/* The banner is the honesty surface. It appears ONLY when something is actually wrong, so its
   presence is information -- a banner that is always there is furniture. */
.banner{
  border:1px solid var(--accent); border-radius:var(--radius-card);
  background:var(--fill); padding:.75rem .875rem; margin-bottom:1.25rem;
}
.banner .mc{color:var(--accent); display:block; margin-bottom:.25rem}
.banner p{margin:0; font-size:.875rem}

.card{
  border:1px solid var(--card-border); border-radius:var(--radius-card);
  background:var(--card-background); padding:1.125rem 1rem; margin-bottom:1rem;
}
.card--now{box-shadow:var(--plate)}
.kind{color:var(--accent); display:block; margin-bottom:.375rem}
h1{font-size:1.375rem; line-height:1.25; margin:0 0 1rem 0; font-weight:600; letter-spacing:-.01em}

/* THE NUMBER. The one element on this screen that has to be readable at arm's length at 6am,
   which is the whole reason the app exists. It scales with the viewport and is capped so it
   cannot wrap at 320 px. */
.clock{margin:0 0 .875rem 0}
.clock .label{color:var(--quiet); display:block; margin-bottom:.125rem}
.clock time{
  display:block; font-size:clamp(3rem, 17vw, 4.25rem); line-height:1;
  font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
  color:var(--accent);
}
.clock .window{color:var(--quiet); font-size:.8125rem; margin-top:.375rem; display:block}

dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.375rem .75rem; align-items:baseline}
dt{color:var(--quieter); white-space:nowrap}
dd{margin:0; font-size:.9375rem; overflow-wrap:anywhere}

.rule{border:0; border-top:1px solid var(--hairline); margin:1rem 0}
.onerule{margin:0; font-size:1rem; line-height:1.45}
.bring{margin:.75rem 0 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.375rem}
.bring li{border:1px solid var(--hairline); border-radius:2px; padding:.125rem .5rem; font-size:.8125rem}

.next{display:flex; flex-wrap:wrap; gap:.25rem .625rem; align-items:baseline}
.next .when{color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap}
.next .what{font-size:.9375rem}
.later{color:var(--quieter); font-size:.8125rem; margin:.5rem 0 0 0}

.why{color:var(--quiet); font-size:.875rem; line-height:1.55; margin:0}
.why .mc{display:block; color:var(--quieter); margin-bottom:.25rem}

footer{margin-top:1.5rem; color:var(--quieter); font-size:.6875rem}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

/* ── the theme control ─────────────────────────────────────────────────────────────────────
   THE SITE'S `chip` AND `chip-icon`, WRITTEN OUT. The classes do not travel -- this page loads
   no stylesheet from calvin.sg and never could -- so what transfers is the vocabulary: the
   quiet surface at a hairline of the ink, no plate, 2.75rem on both axes, and the inverted fill
   for the option that is current. The plate is this design's mark for a page's ONE action, and
   setting a preference is furniture, so furniture recedes and the number stays the loudest
   thing on the screen. It sits at the FOOT for the same reason: at 6am the plan is what the
   eye and the keyboard should meet first.

   THREE EXCLUSIVE STATES ARE NOT A TOGGLE BUTTON. The site's control reports a pressed state,
   which is right for two; the WAI-ARIA pattern for a set of three is the radio group. These
   are native radios, so the grouping, the checked state and the arrow-key roving are the
   platform's rather than a re-implementation of them, and the label is the whole target.

   THE MARK SET IS CLOSED. It ships a sun and a moon and nothing that means "follow the
   system", so that option is drawn as a WORD -- never an emoji, never a second icon family. */
.sr-only,.theme input{
  position:absolute; width:1px; height:1px; padding:0; margin:0; overflow:hidden;
  clip-path:inset(50%); white-space:nowrap; border:0;
}
.chrome{margin-top:1.5rem}
.theme{position:relative; display:flex; flex-wrap:wrap; gap:.5rem; border:0; margin:0; padding:0; min-inline-size:0}
.theme label{
  display:inline-flex; align-items:center; justify-content:center; gap:.4em;
  /* 2.75rem on BOTH axes: the enhanced target size, in rem so it grows with the reader's own
     text rather than pinning a box in pixels the text then outgrows. */
  min-height:2.75rem; min-width:2.75rem; padding:.3rem .7rem;
  border:1px solid var(--hairline); border-radius:2px;
  background:var(--background); color:var(--text); cursor:pointer;
  font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:color .3s cubic-bezier(.4,0,.2,1), background-color .3s cubic-bezier(.4,0,.2,1),
             border-color .3s cubic-bezier(.4,0,.2,1);
}
/* The glyph box is PINNED where the labelled one is floored: a label comes from the vocabulary
   and must be allowed to grow, a mark is a size the design picked. */
.theme label.glyph{width:2.75rem; height:2.75rem; padding:0}
.theme svg{width:1.25rem; height:1.25rem; display:block; fill:currentColor}
/* Guarded, because a touch browser applies :hover on tap and holds it until something else is
   tapped -- which would leave the last option pressed wearing the accent beside the one that is
   genuinely current, faking the exact distinction this row exists to draw. */
@media (hover: hover){
  .theme label:hover{border-color:var(--accent); color:var(--accent)}
}
/* The current option, in the site's own inverted treatment. */
.theme input:checked + label{background:var(--text); border-color:var(--text); color:var(--background)}
/* A press shows something on EVERY option including the current one, and it SNAPS: a tap is
   over in about 100ms against a 300ms ramp, so an eased press is drawn about a third of the way
   and then undrawn. Below the checked rule on purpose, so the option you are already on also
   answers the finger. */
.theme label:active{border-color:var(--accent); color:var(--accent); transition:none}
/* ...and the option you are already on keeps its readable ink, because accent on the --text
   flood measures 2.77:1 light and 1.37:1 dark. The accent border still says the tap landed. */
.theme input:checked + label:active{color:var(--background); transition:none}
/* Focus gets its own rule and is never listed with hover: hover is a pointer's affordance and
   some readers have no pointer. The ring goes on the label because the input is the 1px box. */
.theme input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
/* THE SWAP SNAPS, and this is the same rule as the press one above rather than a new idea.
   The 300ms ramp is the chip's hover and press affordance; a THEME change moves every token
   under it at once, so without this the ground flips instantly while the chips ease across for
   a third of a second -- measured in the browser, the chips still resolving the OLD palette's
   #111111 on the NEW palette's #fafafa ground. That is an acknowledgement of the press fading
   in after the press, which is the one thing this design says a press must never do. Set for
   exactly one forced reflow by the script below, so hover and press keep their ramp. */
:root[data-swapping] .theme label{transition:none}
/* A forced-colours mode replaces every author colour, so the inverted fill -- the only thing
   saying which option is current -- would arrive blank. The marks need nothing: they are inline
   SVG filled with currentColor, not a mask over a background the mode overrides. */
@media (forced-colors: active){
  .theme input:checked + label{
    forced-color-adjust:none; background:Highlight; border-color:CanvasText; color:HighlightText;
  }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
                       transition-duration:.01ms !important; scroll-behavior:auto !important}
}
</style>
<script nonce="__NONCE__">
// PRE-PAINT, AND IT HAS TO BE HERE. A stored choice applied after the first paint is a visible
// flash of the other theme. This page owns its own <head>, which is the one thing a plan
// artifact lifting this palette cannot do -- there, the restore goes first in the page content
// and the flash is the price.
//
// It writes NOTHING when nothing is stored. The absent attribute is the third state, and the
// two blocks above already paint it.
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* Reading storage throws outright in some contexts. The page is correct with
                   nothing stored, which is the same state as never having chosen. */ }
})();
</script>
</head>
<body>
<main id="root" tabindex="-1"></main>

<!-- The one piece of chrome, and the only markup on this page that is not drawn by the renderer:
     it belongs to the reader rather than to the week, so it must be there before /s answers and
     must survive every refusal. `system` is FIRST because it is the state the page opens in. -->
<footer class="chrome">
  <fieldset class="theme">
    <legend class="sr-only">Theme</legend>
    <input type="radio" name="theme" id="theme-system" value="system">
    <label for="theme-system">System</label>
    <input type="radio" name="theme" id="theme-light" value="light">
    <label class="glyph" for="theme-light">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/></svg>
      <span class="sr-only">Light</span>
    </label>
    <input type="radio" name="theme" id="theme-dark" value="dark">
    <label class="glyph" for="theme-dark">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 7C10 10.866 13.134 14 17 14C18.9584 14 20.729 13.1957 21.9995 11.8995C22 11.933 22 11.9665 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C12.0335 2 12.067 2 12.1005 2.00049C10.8043 3.27098 10 5.04157 10 7ZM4 12C4 16.4183 7.58172 20 12 20C15.0583 20 17.7158 18.2839 19.062 15.7621C18.3945 15.9187 17.7035 16 17 16C12.0294 16 8 11.9706 8 7C8 6.29648 8.08133 5.60547 8.2379 4.938C5.71611 6.28423 4 8.9417 4 12Z"/></svg>
      <span class="sr-only">Dark</span>
    </label>
  </fieldset>
</footer>

<script nonce="__NONCE__">
(function () {
  "use strict";

  // The control, and nothing about the week. It is wired separately from the app below because
  // it must keep working through every path that one takes -- including the two that render an
  // error and return.
  var docEl = document.documentElement;
  var inputs = document.querySelectorAll(".theme input[name=theme]");

  // SEEDED FROM WHAT IS ALREADY STAMPED, not from storage: the pre-paint script in <head> has
  // already run, so the attribute IS the resolved answer, and reading it here means there is one
  // place that decides what "current" means. Nothing is written until he chooses.
  var t = docEl.getAttribute("data-theme");
  var current = (t === "dark" || t === "light") ? t : "system";

  function choose(value) {
    // The un-stamped state is the ABSENCE of the attribute, which is why removing it is the
    // whole of "follow the system" -- there is no third palette and no matchMedia listener,
    // because block 2 is a media query and CSS re-resolves it on its own.
    // Suppress the chips' colour ramp across the swap, then restore it. The forced reflow
    // between the two is what makes this work: it flushes style with transition:none still in
    // effect and the new palette already applied, so no transition is ever started.
    docEl.setAttribute("data-swapping", "");
    if (value === "system") docEl.removeAttribute("data-theme");
    else docEl.setAttribute("data-theme", value);
    void docEl.offsetWidth;
    docEl.removeAttribute("data-swapping");
    syncChrome();
    try {
      localStorage.setItem("theme", value);
    } catch (e) { /* Storage throws outright in some contexts. A preference that cannot be
                     remembered is still a preference that works for this visit. */ }
  }

  for (var i = 0; i < inputs.length; i++) {
    inputs[i].checked = inputs[i].value === current;
    inputs[i].addEventListener("change", function () {
      if (this.checked) choose(this.value);
    });
  }
  // ── the Telegram bridge, and the seam the control just made visible ─────────────────────
  //
  // Telegram paints its own header and the ground behind this page from ITS theme, which the
  // reader sets independently of the OS. That was survivable while this page only ever followed
  // prefers-color-scheme -- the two disagreed no more often than the OS and Telegram did. It is
  // NOT survivable now: the control above lets him choose light while Telegram is dark, and the
  // page then sits light under a dark header with dark ground below it.
  //
  // Telegram's own guidance is to "deliver a seamless experience by monitoring the dynamic
  // theme-based colors provided by the API and using them accordingly". For a page that carries
  // its own design system the compliant direction is OUTWARD: tell Telegram what this page is
  // painted, rather than repainting this page in Telegram's colours -- which would put fifteen
  // tokens' worth of decided design at the mercy of whatever custom theme he is running.
  //
  // The value is READ OUT OF THE TOKEN, never written here: --background is the one thing that
  // already says what the resolved ground is in all three states, and a literal would be a hex
  // outside the palette blocks and wrong in two states out of three.
  function syncChrome() {
    var bg = getComputedStyle(docEl).getPropertyValue("--background").trim();
    // Only ever a plain #rrggbb -- the guard is here so a token that grows a color-mix() or
    // resolves empty sends nothing rather than something Telegram will reject.
    if (!/^#[0-9a-f]{6}$/i.test(bg)) return;
    postEvent("web_app_set_background_color", { color: bg });
    // `color` on the header needs Bot API 6.9; older clients ignore the event, which leaves the
    // header where it already was. The alternative, color_key:"bg_color", is worse than nothing
    // here -- it paints the header from TELEGRAM's palette, which is the disagreement itself.
    postEvent("web_app_set_header_color", { color: bg });
  }

  // Tell Telegram the app is up and ask for full height. telegram-web-app.js is deliberately NOT
  // loaded: it is an external request this page is not allowed to make, and the two events it
  // would send for us are one postMessage each. If the bridge is missing the app still renders --
  // it just opens at the default half height. Cosmetic paths fail open.
  function postEvent(type, data) {
    var payload = JSON.stringify(data || {});
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
        window.TelegramWebviewProxy.postEvent(type, payload); return;
      }
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) {
        window.webkit.messageHandlers.performAction.postMessage({ eventType: type, eventData: data || {} }); return;
      }
      if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || {} }), "https://web.telegram.org");
      }
    } catch (e) { /* fail open */ }
  }

  var view = null;
  var root = document.getElementById("root");

  // Telegram puts the launch parameters in the URL FRAGMENT, which is never sent to a server --
  // so nothing can be proven about the first GET, and this is the request that proves it. The
  // query string is checked too because a direct link can deliver them there on some clients.
  function launchParams() {
    var sources = [location.hash.replace(/^#/, ""), location.search.replace(/^\?/, "")];
    for (var i = 0; i < sources.length; i++) {
      try {
        var v = new URLSearchParams(sources[i]).get("tgWebAppData");
        if (v) return v;
      } catch (e) { /* fall through */ }
    }
    return "";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    // textContent everywhere. Nothing from the payload is ever parsed as HTML: the artifact's
    // renderer has five fields it treats as raw markup and NONE of them are published here, so
    // this page has no reason to ever hold that door open.
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function add(parent, node) { parent.appendChild(node); return node; }

  function hhmm(iso) {
    var m = /T(\d{2}):(\d{2})/.exec(iso || "");
    return m ? m[1] + ":" + m[2] : null;
  }
  function dayLabel(s) {
    var dow = (s.dow || "").slice(0, 3);
    var d = /^(\d{4})-(\d{2})-(\d{2})/.exec(s.date || "");
    if (!d) return dow;
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return (dow ? dow + " " : "") + String(Number(d[3])) + " " + months[Number(d[2]) - 1];
  }

  function banner(kicker, body) {
    var b = el("div", "banner");
    b.setAttribute("role", "status");
    add(b, el("span", "mc", kicker));
    add(b, el("p", null, body));
    return b;
  }

  function renderHeader() {
    var h = el("header");
    if (view.weekLabel) add(h, el("span", "week mc", view.weekLabel));
    if (view.generatedAt) {
      var t = el("span", "asof", "updated " + (hhmm(view.generatedAt) || "") + " " + (view.generatedAt || "").slice(0, 10));
      add(h, t);
    }
    return h;
  }

  function renderSession(s) {
    var c = el("div", "card card--now");
    add(c, el("span", "kind mc", s.kind));
    add(c, el("h1", null, s.title));

    // leaveBy is the point of this screen -- but it is present on 13 of 20 sessions in one real
    // artifact and 0 of 17 in the other, so it CANNOT be assumed. Fall back to the start time,
    // and when there is neither, show no clock at all rather than an empty one.
    var big = hhmm(s.leaveBy), label = "Leave by";
    if (!big) { big = hhmm(s.at); label = "Starts"; }
    if (big) {
      var clock = el("p", "clock");
      add(clock, el("span", "label mc", label));
      var time = el("time", null, big);
      time.setAttribute("datetime", s.leaveBy || s.at);
      add(clock, time);
      var window_ = dayLabel(s);
      var from = hhmm(s.at), to = hhmm(s.until);
      if (from) window_ += " · " + from + (to ? "–" + to : "");
      add(clock, el("span", "window", window_));
      add(c, clock);
    }

    var dl = el("dl");
    var any = false;
    if (s.place)  { add(dl, el("dt", "mc", "Where")); add(dl, el("dd", null, s.place));  any = true; }
    if (s.travel) { add(dl, el("dt", "mc", "Travel")); add(dl, el("dd", null, s.travel)); any = true; }
    if (any) add(c, dl);

    if (s.oneRule) {
      add(c, el("hr", "rule"));
      add(c, el("p", "onerule", s.oneRule));
    }
    if (Array.isArray(s.bring) && s.bring.length) {
      var ul = el("ul", "bring");
      ul.setAttribute("aria-label", "Bring");
      for (var i = 0; i < s.bring.length; i++) add(ul, el("li", null, s.bring[i]));
      add(c, ul);
    }
    return c;
  }

  function renderNext(s) {
    var c = el("div", "card");
    add(c, el("span", "kind mc", "Next"));
    var row = el("p", "next");
    var when = dayLabel(s);
    var t = hhmm(s.at);
    if (t) when += " · " + t;
    add(row, el("span", "when", when));
    add(row, el("span", "what", s.title));
    add(c, row);
    if (view.laterCount > 0) {
      add(c, el("p", "later", view.laterCount === 1
        ? "1 more after that in the next three days."
        : view.laterCount + " more after that in the next three days."));
    }
    return c;
  }

  function render(v) {
    view = v;
    root.textContent = "";

    if (!view.ok) {
      add(root, banner("Cannot show the plan", view.error || "Something is wrong with the published plan."));
      return;
    }

    add(root, renderHeader());

    // Two different kinds of out-of-date, reported separately. A plan pushed an hour ago for last
    // week is fresh and useless; a plan for this week pushed four days ago is old and correct.
    if (!view.coversToday) {
      add(root, banner("Not this week", "The published plan runs " + view.weekStart + " to " + view.weekEnd +
        ", so it says nothing about today (" + view.today + "). There is nothing here for today, and " +
        "anything shown would be a guess."));
    } else if (view.stale) {
      var age = view.ageHours === null ? null : Math.round(view.ageHours);
      add(root, banner("Possibly out of date", age === null
        ? "This plan does not say when it was published, so how current it is cannot be established."
        : "This plan was last published about " + age + " hours ago. It may not reflect a change made since."));
    }

    if (view.now) {
      add(root, renderSession(view.now));
      if (view.next) add(root, renderNext(view.next));
      if (view.now.intention) {
        var why = el("p", "why");
        add(why, el("span", "mc", "Why this session"));
        why.appendChild(document.createTextNode(view.now.intention));
        add(root, why);
      }
    } else if (view.coversToday) {
      add(root, banner(
        view.emptyReason === "empty" ? "Nothing published" : "Nothing left",
        view.emptyReason === "empty"
          ? "The published plan contains no days at all."
          : "Nothing is still to come in the next three days. Everything in that window is done, missed, or a rest by design."));
    }

    var f = el("footer", null, view.plannedKm
      ? view.weekLabel + " · " + view.plannedKm + " km planned" + (view.ceilingKm ? " of a " + view.ceilingKm + " km ceiling" : "")
      : view.weekLabel);
    add(root, f);
  }

  // Tell Telegram we are up before the network call, so the client stops showing its own
  // placeholder while we wait.
  postEvent("web_app_ready");
  postEvent("web_app_expand");
  // After ready, deliberately: the client sets up its own chrome on that event, so colours sent
  // before it are the ones it overwrites.
  syncChrome();

  // The three messages below are chosen from what the CLIENT already knows -- whether it had
  // launch parameters, whether the server said no, whether the network answered at all. They tell
  // a stranger nothing: the server's reply is one 401 with an empty body in every refusal.
  var params = launchParams();
  if (!params) {
    render({ ok: false, error: "Open this from your chat with Mochi." });
    return;
  }
  fetch("/s", {
    method: "POST",
    body: params,
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    cache: "no-store",
    credentials: "omit",
  }).then(function (r) {
    if (!r.ok) { render({ ok: false, error: "This app is not available for your account." }); return null; }
    return r.json();
  }).then(function (v) {
    if (v) render(v);
  }).catch(function () {
    render({ ok: false, error: "Could not reach the plan. Try again in a moment." });
  });
})();
</script>
</body>
</html>
